<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f24"/><stop offset="1" stop-color="#050607"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- decade scale: ticks every 1/3 decade, major ticks at prefixes -->
  <g stroke="#ffb547" stroke-linecap="round">
    <line x1="152" y1="760" x2="872" y2="760" stroke-width="14"/>
    <line x1="192" y1="760" x2="192" y2="680" stroke-width="18"/>
    <line x1="352" y1="760" x2="352" y2="716" stroke-width="12"/>
    <line x1="512" y1="760" x2="512" y2="680" stroke-width="18"/>
    <line x1="672" y1="760" x2="672" y2="716" stroke-width="12"/>
    <line x1="832" y1="760" x2="832" y2="680" stroke-width="18"/>
  </g>
  <g font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="700" text-anchor="middle">
    <text x="512" y="560" font-size="400" fill="#ffffff" letter-spacing="-20">4<tspan fill="#ffb547">k</tspan>7</text>
    <text x="192" y="860" font-size="88" fill="#8a949e">µ</text>
    <text x="512" y="860" font-size="88" fill="#8a949e">1</text>
    <text x="832" y="860" font-size="88" fill="#8a949e">M</text>
  </g>
</svg>
