<title>PrefixCalc</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen instrument. History scrolls on top, display in the middle, keypad pinned to the thumb zone. */
:root {
  --H: var(--app-h, 100dvh); /* usable screen height: key sizes follow it */
  --bg: #eef0f2; --panel: #ffffff; --key: #ffffff; --key-fn: #e2e6ea; --key-op: #d9e2ec;
  --fg: #14181c; --muted: #66707a; --line: #d3d8dd;
  --prefix: #b86e00; --prefix-bg: #fff3df; --res-bg: #e6eefa; --res-line: #b9cdee; --eq: #1d5fd1; --eq-fg: #ffffff; --err: #c23a2b; --ok: #1f7a4a;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --panel: #0b0d0f; --key: #16191c; --key-fn: #22262a; --key-op: #1b2633;
  --fg: #eef1f4; --muted: #8a949e; --line: #262b30;
  --prefix: #ffb547; --prefix-bg: #241a0a; --res-bg: #0d1a2c; --res-line: #24406a; --eq: #3d7ff0; --eq-fg: #ffffff; --err: #ff6b5b; --ok: #4cc38a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #000000; --panel: #0b0d0f; --key: #16191c; --key-fn: #22262a; --key-op: #1b2633;
  --fg: #eef1f4; --muted: #8a949e; --line: #262b30;
  --prefix: #ffb547; --prefix-bg: #241a0a; --res-bg: #0d1a2c; --res-line: #24406a; --eq: #3d7ff0; --eq-fg: #ffffff; --err: #ff6b5b; --ok: #4cc38a; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
.app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 8px; box-sizing: border-box; }

header { display: flex; align-items: center; justify-content: space-between; }
header h1 { font: 600 13px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; margin: 0; color: var(--muted); }
header h1 b { color: var(--prefix); font-weight: 600; }
.hdr-btns { display: flex; gap: 6px; }
.chip { font: 500 12px/1 var(--sans); color: var(--muted); background: transparent; border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 10px; cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }

.history { flex: 1 1 auto; min-height: 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px;
  justify-content: flex-end; }
.history:empty::before { content: "No history yet. Press = to save a calculation."; color: var(--muted); font-size: 12px; text-align: right; }
.h-item { display: flex; justify-content: space-between; gap: 12px; padding: 6px 4px; border-radius: 6px; cursor: pointer;
  font: 400 14px/1.3 var(--mono); }
.h-item:active { background: var(--key-fn); }
.h-expr { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.h-val { color: var(--fg); white-space: nowrap; }

.display { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex;
  flex-direction: column; gap: 6px; }
#expr { width: 100%; box-sizing: border-box; border: 0; outline: 0; background: transparent; color: var(--fg);
  font: 400 22px/1.3 var(--mono); text-align: right; padding: 2px 0; caret-color: var(--eq); -webkit-user-select: text; user-select: text; }
.res-row { display: flex; align-items: center; gap: 6px; }
.eng { flex: none; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: transparent;
  color: var(--muted); font: 500 14px/1 var(--mono); cursor: pointer; }
#result { flex: 1; min-width: 0; text-align: right; font: 500 40px/1.1 var(--mono); font-variant-numeric: tabular-nums;
  white-space: nowrap; overflow-x: auto; cursor: pointer; touch-action: pan-y; scrollbar-width: none; }
#result .pfx { color: var(--prefix); }
#result.err { color: var(--err); font-size: 20px; font-family: var(--sans); }
#result.idle { color: var(--muted); }
.shift-badge { font: 500 10px/1 var(--sans); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.alts { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 4px 14px; font: 400 13px/1.3 var(--mono); color: var(--muted); min-height: 17px; }
.alts span + span::before { content: "|"; margin-right: 14px; color: var(--line); }
.eser { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px dashed var(--line); padding-top: 6px; min-height: 26px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--muted); font: 500 12px/1 var(--mono); padding: 6px 8px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
#eval { font: 400 14px/1.2 var(--mono); text-align: right; }
#eval .pct { color: var(--muted); }

.keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.prefixes { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.hsw { display: none; }
.key { display: flex; align-items: center; justify-content: center; box-sizing: border-box; text-align: center; -webkit-user-select: none; user-select: none; height: clamp(38px, calc(var(--H) * 0.063), 58px); border: 0; border-radius: 12px; background: var(--key); color: var(--fg); font: 500 21px/1 var(--mono);
  cursor: pointer; touch-action: manipulation; box-shadow: 0 1px 0 var(--line); }
.key:active, .key.down { filter: brightness(.88); transform: translateY(1px); }
.key.fn { background: var(--key-fn); font-size: 17px; }
.key.op { background: var(--key-op); }
.key.eq { background: var(--eq); color: var(--eq-fg); }
.key.ac { color: var(--err); font-family: var(--sans); font-weight: 600; font-size: 16px; }
.key.px { height: clamp(30px, calc(var(--H) * 0.05), 48px); background: var(--prefix-bg); color: var(--prefix); font-size: 19px; box-shadow: none; }
.key.small { height: clamp(28px, calc(var(--H) * 0.043), 40px); font-size: 14px; font-family: var(--sans); }
.cursor-row { display: grid; grid-template-columns: 1fr 1fr 1.4fr 1.6fr; gap: 6px; }
.key.tools { background: var(--key-op); font-weight: 600; }

/* Tools sheet: full-screen panel over the calculator */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; -webkit-user-select: text; user-select: text;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-inner { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 32px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; }
.sheet-head h2 { margin: 0; font: 600 20px/1.2 var(--sans); outline: none; }
.done { font: 600 15px/1 var(--sans); color: var(--eq); background: transparent; border: 0; padding: 8px 4px; cursor: pointer; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: 500 13px/1 var(--sans); padding: 10px 4px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); }
.tool-hint { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
.modes { display: flex; gap: 6px; flex-wrap: wrap; }
.modes button { font: 500 13px/1 var(--sans); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--res-bg); color: var(--eq); border-color: var(--eq); font-weight: 600; }
.modes[hidden], .field-err[hidden], .field-note[hidden], .field[hidden], .calc-tag[hidden], .use[hidden], .clear-btn[hidden] { display: none; }
.step { margin: 0; font: 600 11px/1.2 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font: 500 13px/1.2 var(--sans); color: var(--fg); }
.field label .unit { color: var(--muted); font-weight: 400; }
.field label .opt { color: var(--muted); font-weight: 400; }
.field input { width: 100%; box-sizing: border-box; font: 400 18px/1.2 var(--mono); color: var(--fg); background: var(--panel);
  border: 1px solid var(--muted); border-radius: 10px; padding: 10px; outline: none; }
.field input:focus { border-color: var(--eq); box-shadow: 0 0 0 2px var(--res-line); }
.field input[aria-invalid="true"] { border-color: var(--err); }
.field-err { font-size: 12px; line-height: 1.35; color: var(--err); }
.field-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 26px; }
.field-box { position: relative; }
.field-box input { padding-right: 38px; }
.field input.computed { background: var(--res-bg); border: 1px dashed var(--eq); }
.field input.computed::placeholder { color: var(--fg); opacity: 1; font-weight: 600; }
.field input.computed.err::placeholder, .field input.missing::placeholder { color: var(--muted); font-weight: 400; }
.field input::placeholder { color: var(--muted); opacity: 1; }
.clear-btn { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border: 0; border-radius: 50%;
  background: transparent; color: var(--muted); font: 400 20px/1 var(--sans); cursor: pointer; }
.clear-btn:hover { background: var(--key-fn); }
.calc-tag { font: 600 10px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--eq); }
.field .use { padding: 5px 8px; }
.field-note { font-size: 12px; line-height: 1.35; color: var(--muted); }
.tool-status { margin: 0; font-size: 14px; line-height: 1.4; color: var(--muted); min-height: 1.4em; }
.tool-status.err { color: var(--err); }
.tool-status.ok { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.result[hidden] { display: none; }
.result { background: var(--res-bg); border: 1px solid var(--res-line); border-radius: 14px; padding: 4px 14px 6px; }
.result .step { margin: 10px 0 2px; }
.out { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--res-line); }
.result .step + .out { border-top: 0; }
.out-label { flex: 1; min-width: 0; font-size: 14px; }
.out-val { font: 600 20px/1.2 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.out-val .pfx { color: var(--prefix); }
.out-note { font: 400 12px/1.2 var(--mono); color: var(--muted); white-space: nowrap; }
.use { flex: none; font: 600 12px/1 var(--sans); color: var(--eq); background: transparent; border: 1px solid var(--res-line); border-radius: 8px; padding: 7px 9px; cursor: pointer; }
.result-empty { padding: 10px 0 8px; color: var(--muted); font-size: 14px; line-height: 1.4; }
@media (max-width: 360px) { .out-note { display: none; } }
.key:focus-visible, .chip:focus-visible, .eng:focus-visible, .seg button:focus-visible { outline: 2px solid var(--eq); outline-offset: 2px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
  background: var(--fg); color: var(--bg); font: 500 13px/1 var(--sans); padding: 10px 14px; border-radius: 999px; opacity: 0;
  transition: opacity .15s, transform .15s; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-height: 700px) { #result { font-size: 32px; } }
@media (max-height: 600px) { .key { font-size: 19px; } #result { font-size: 28px; } #expr { font-size: 19px; } .app { gap: 6px; } }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } .key:active { transform: none; } }

/* ---------- shell: mode bar + one mode on screen ---------- */
.shell { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; }
.modebar { display: flex; align-items: center; gap: 8px; padding: 8px max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); }
.modetabs { display: flex; gap: 2px; padding: 3px; border-radius: 11px; background: var(--key-fn); }
.modetabs button { border: 0; background: transparent; color: var(--muted); font: 600 13px/1 var(--sans); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
.modetabs button[aria-selected="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.18); }
.modebar .spacer { flex: 1; }
.shell .app { height: auto; flex: 1 1 auto; min-height: 0; max-width: none; margin: 0; }
.tools-mode { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-user-select: text; user-select: text; }
.mode[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Calc: natural display ---------- */
.ind { display: flex; align-items: center; gap: 5px; flex: none; font: 600 10px/1 var(--sans); letter-spacing: .06em; color: var(--muted); }
.ind .flag { padding: 3px 5px; border-radius: 4px; background: var(--prefix-bg); color: var(--prefix); }
.ind .flag[hidden] { display: none; }
.ind-btn { font: 600 10px/1 var(--sans); letter-spacing: .06em; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; cursor: pointer; }
.ind .spacer { flex: 1; }
.nat { font: 400 26px/1.25 var(--sans); font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--fg); }
.nat-in { min-height: clamp(42px, calc(var(--H) * 0.08), 76px); display: flex; align-items: center; overflow-x: auto; overflow-y: hidden; padding: 6px 2px; scrollbar-width: none; cursor: text; touch-action: pan-y; }
.nat-in::-webkit-scrollbar, .cres::-webkit-scrollbar { display: none; }
.nat-in > .row { margin-left: auto; }
.row { display: inline-block; white-space: nowrap; }
.nat .op { margin: 0 .16em; }
.nat .var { font-style: italic; }
.nat .ans { font-size: .78em; font-weight: 600; letter-spacing: .02em; }
.nat .comb { font-size: .82em; font-weight: 600; margin: 0 .1em; }
.nat .fname { font-size: .9em; margin-right: .03em; }
.nat .paren { display: inline-block; transform-origin: 50% 55%; }
.t-frac { display: inline-block; vertical-align: middle; text-align: center; margin: 0 .1em; }
.t-frac > .t-num { display: block; padding: 0 .14em .05em; border-bottom: max(1.5px, .065em) solid currentColor; }
.t-frac > .t-den { display: block; padding: .07em .14em 0; }
.t-sup { display: inline-block; font-size: .66em; vertical-align: .85em; margin-left: .04em; }
.t-sub { display: inline-block; font-size: .66em; vertical-align: -.3em; }
.t-x10 { white-space: nowrap; }
.t-x10 .x10 { margin-left: .12em; }
.t-sqrt { display: inline-block; position: relative; margin-left: .6em; padding: .1em .08em 0 .06em; border-top: max(1.5px, .065em) solid currentColor; }
.t-sqrt > svg { position: absolute; left: -.6em; top: max(-1.5px, -.065em); width: .6em; height: calc(100% + .065em); overflow: visible; }
.t-sqrt > svg path { fill: none; stroke: currentColor; stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.t-root > .t-idx { display: inline-block; font-size: .55em; vertical-align: .95em; margin-right: -1.15em; min-width: 1em; text-align: right; position: relative; }
.t-abs > .bar { display: inline-block; width: 0; border-left: max(1.5px, .06em) solid currentColor; height: 1.1em; vertical-align: -.2em; margin: 0 .12em; transform-origin: 50% 55%; }
.slot { display: inline-block; width: .6em; height: .82em; border: 1.5px dashed var(--muted); border-radius: 3px; vertical-align: -.06em; box-sizing: border-box; position: relative; }
.slot.active { border-style: solid; border-color: var(--eq); }
.slot.ghost { opacity: .6; }
.caret { display: inline-block; width: 2px; height: 1.15em; margin: 0 -1px; vertical-align: -.22em; background: var(--eq); animation: blink 1.06s steps(1) infinite; position: relative; z-index: 1; }
.slot > .caret { position: absolute; left: 1px; top: 1px; bottom: 1px; height: auto; margin: 0; }
.done-state .caret { display: none; }
@keyframes blink { 50% { opacity: 0; } }
.cres { display: flex; align-items: center; min-height: clamp(32px, calc(var(--H) * 0.058), 56px); overflow-x: auto; scrollbar-width: none; cursor: pointer; }
.cres > .nat { margin-left: auto; font-size: 30px; font-weight: 500; }
.cres.live > .nat { color: var(--muted); }
.cres.err > .nat { color: var(--err); font-size: 18px; font-weight: 500; }
.cres .pfx-badge { margin-left: 8px; font: 600 15px/1 var(--mono); color: var(--prefix); background: var(--prefix-bg); border-radius: 6px; padding: 4px 6px; flex: none; }
.cfoot { display: flex; align-items: center; gap: 8px; border-top: 1px dashed var(--line); padding-top: 6px; min-height: 30px; }
.calt { flex: 1; min-width: 0; display: flex; justify-content: flex-end; align-items: center; gap: 10px; font: 400 14px/1.2 var(--mono); color: var(--muted); overflow: hidden; white-space: nowrap; }
.calt .nat { font-size: 16px; color: var(--muted); }
.calt .send { font: 600 12px/1 var(--sans); color: var(--eq); background: transparent; border: 1px solid var(--res-line); border-radius: 8px; padding: 6px 8px; cursor: pointer; }
.calt .send .pfx { color: var(--prefix); }
.chist .h-item { align-items: center; padding: 4px; }
.chist .h-expr { overflow: visible; }
.chist .nat { font-size: 15px; }
.chist .h-expr { color: var(--muted); }
.chist .h-expr .nat { color: var(--muted); }
.fkeys { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; position: relative; }
.key.f { height: clamp(30px, calc(var(--H) * 0.05), 48px); font: 500 15px/1 var(--sans); background: var(--key-fn); position: relative; padding: 9px 0 0; }
.key .sl { position: absolute; top: 3px; left: 0; right: 0; font: 600 9.5px/1 var(--sans); color: var(--prefix); white-space: nowrap; }
.key .ml sup, .key .sl sup { font-size: .7em; line-height: 0; }
.key .ml sub, .key .sl sub { font-size: .7em; line-height: 0; }
.key.f.nav { padding: 0; font-size: 14px; }
.key.shift[aria-pressed="true"], .key.hyp[aria-pressed="true"] { background: var(--prefix); color: var(--bg); }
.shift-on .key.f:not(.shift) .ml { opacity: .3; }
.shift-on .key .sl { font-size: 11px; top: 2px; }
.kbox { display: inline-block; width: .55em; height: .62em; border: 1.2px solid currentColor; border-radius: 2px; vertical-align: -.05em; box-sizing: border-box; }
.kfrac { display: inline-flex; flex-direction: column; align-items: center; gap: 1.5px; vertical-align: middle; }
.kfrac i { display: block; width: .6em; height: .5em; border: 1.2px solid currentColor; border-radius: 2px; box-sizing: border-box; }
.kfrac b { display: block; width: .85em; height: 2px; border-radius: 1px; background: currentColor; }
.ckeys .key { height: clamp(36px, calc(var(--H) * 0.062), 62px); }
.ckeys .key.ansk { font: 600 15px/1 var(--sans); }
.ckeys .key.x10k { font: 500 16px/1 var(--sans); }
.varpanel { position: absolute; inset: 0; z-index: 3; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: grid;
  grid-template-columns: repeat(3, 1fr); gap: 5px; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.varpanel[hidden] { display: none; }
.varpanel .vp-head { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; font: 600 12px/1 var(--sans); color: var(--muted); }
.varpanel button.v { border: 1px solid var(--line); background: var(--key); color: var(--fg); border-radius: 8px; font: 500 13px/1.1 var(--mono); padding: 4px 6px; text-align: left; cursor: pointer; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.varpanel button.v b { font: italic 600 15px/1 var(--sans); margin-right: 6px; }
.varpanel .vp-actions { grid-column: 1 / -1; display: flex; gap: 6px; }
.varpanel .vp-actions button { flex: 1; }

<script>
// ---------- shell: mode registry, shared settings, haptics, Ans ----------
// A mode registers { id, title, el, show(), accept(number)?, clearHistory()? }. The shell adds its tab,
// shows one mode at a time, and routes values between modes (Tools "Use" → the last calculator mode).
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem('prefixcalc:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('prefixcalc:' + k, JSON.stringify(v)); } catch (e) {} }
  };
  var haptic = store.get('haptic', true);
  // Android/Chrome: Vibration API. iOS has none, and since iOS 26 a switch clicked from code no longer ticks:
  // only a real finger tap on an <input type="checkbox" switch> does. So every key is a <label> that wraps a
  // hidden switch; the tap on the key toggles the switch and iOS plays its haptic.
  function tactile(el) {
    if (el._tactile) return el;
    el._tactile = true;
    var sw = document.createElement('input');
    sw.type = 'checkbox'; sw.setAttribute('switch', ''); sw.className = 'hsw'; sw.tabIndex = -1; sw.setAttribute('aria-hidden', 'true');
    sw.disabled = !haptic || !!navigator.vibrate;
    el.appendChild(sw);
    el.setAttribute('role', 'button');
    if (!el.hasAttribute('tabindex')) el.tabIndex = 0;
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); el.click(); } });
    return el;
  }
  // a <button class="key"> in the static markup becomes a <label class="key"> before any script binds it
  function toLabel(btn) {
    var l = document.createElement('label');
    Array.prototype.forEach.call(btn.attributes, function (a) { l.setAttribute(a.name, a.value); });
    while (btn.firstChild) l.appendChild(btn.firstChild);
    btn.parentNode.replaceChild(l, btn);
    return tactile(l);
  }
  document.querySelectorAll('button.key').forEach(toLabel);
  // the label forwards a second click to its switch; keep that one away from the key's own handlers
  document.addEventListener('click', function (e) { if (e.target.classList && e.target.classList.contains('hsw')) e.stopPropagation(); }, true);
  var toastT;
  var PC = window.PC = {
    tactile: tactile,
    modes: {}, order: [], current: null, lastCalc: 'calc', store: store, ans: store.get('ans', null),
    buzz: function () {
      if (!haptic) return;
      try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {} // iOS: the key's own switch ticks
    },
    toast: function (msg) {
      var t = $('toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 1300);
    },
    register: function (m) {
      PC.modes[m.id] = m; PC.order.push(m.id);
      var b = document.createElement('button');
      b.setAttribute('role', 'tab'); b.textContent = m.title; b.dataset.mode = m.id;
      b.addEventListener('click', function () { PC.buzz(); PC.show(m.id); });
      $('modeTabs').appendChild(b); m.tab = b;
    },
    show: function (id) {
      if (!PC.modes[id]) id = PC.order[0];
      if (PC.current === id) return;
      PC.order.forEach(function (k) { var m = PC.modes[k]; m.el.hidden = k !== id; m.tab.setAttribute('aria-selected', String(k === id)); });
      PC.current = id;
      if (PC.modes[id].accept) PC.lastCalc = id;
      store.set('mode', id);
      $('clearHist').hidden = !PC.modes[id].clearHistory;
      if (PC.modes[id].show) PC.modes[id].show();
    },
    // a number from Tools goes back to the calculator mode the person came from
    deliver: function (v) { PC.send(PC.lastCalc, v); },
    send: function (id, v) { PC.show(id); PC.modes[id].accept(v); },
    setAns: function (v) { PC.ans = NAT.freeze(typeof v === 'number' ? NAT.revive({ f: v }) : v); store.set('ans', PC.ans); },
    start: function () { PC.show(store.get('mode', 'calc')); }
  };
  $('hapticBtn').setAttribute('aria-pressed', String(haptic));
  $('hapticBtn').addEventListener('click', function () { haptic = !haptic; store.set('haptic', haptic);
    document.querySelectorAll('.hsw').forEach(function (sw) { sw.disabled = !haptic || !!navigator.vibrate; }); this.setAttribute('aria-pressed', String(haptic)); PC.buzz(); });
  $('clearHist').addEventListener('click', function () { var m = PC.modes[PC.current]; if (m.clearHistory) { m.clearHistory(); PC.buzz(); } });
})();
</script>
<script>
// ---------- Calc mode: scientific calculator with natural display ----------
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var N = NAT, store = PC.store, sym = N.sym;
  var exprEl = $('cExpr'), resEl = $('cRes'), altEl = $('cAlt'), histEl = $('cHistory');

  var FIRST = [N.tpl('frac', [[sym('1')], [sym('3')]]), sym('+'), N.tpl('frac', [[sym('1')], [sym('6')]])];
  var ed = new N.Editor(store.get('calc:expr', FIRST));
  var st = {
    angle: store.get('angle', 'deg'), shift: false, hyp: false, done: false, showDec: false, eng: null,
    value: null, error: null, vars: store.get('vars', {}), history: store.get('calc:history', null), varMode: null
  };
  if (!st.history) {
    // first launch: two examples that show what natural display does
    st.history = [
      { tree: [N.tpl('sqrt', [[sym('8')]])], v: N.freeze(N.evaluate([N.tpl('sqrt', [[sym('8')]])])) },
      { tree: [N.fn('sin'), sym('3'), sym('0'), sym(')')], v: { n: '1', d: '2' } }
    ];
  }

  // ---------- evaluation ----------
  function env() { return { angle: st.angle, ans: PC.ans, vars: st.vars }; }
  function compute() {
    st.value = null; st.error = null;
    if (ed.isEmpty()) return;
    try { st.value = N.evaluate(ed.root, env()); }
    catch (e) { st.error = e && e.code ? e : { code: 'syntax', message: 'Syntax error' }; }
  }

  // ---------- rendering of tree rows ----------
  function h(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  var RAD_SVG = '<svg viewBox="0 0 10 30" preserveAspectRatio="none" aria-hidden="true"><path d="M0.5 17 L3 15.5 L6.2 29.5 L10 0"/></svg>';
  var cursorKey = '';
  function keyOf(path) { return JSON.stringify(path); }

  function renderRow(row, path, live) {
    var el = h('span', 'row'), here = live && keyOf(path) === cursorKey;
    if (!row.length) {
      var box = h('span', 'slot');
      if (live) { box._slot = path; if (here) { box.classList.add('active'); box.appendChild(h('span', 'caret')); } }
      el.appendChild(box);
      return el;
    }
    for (var i = 0; i <= row.length; i++) {
      if (here && ed.i === i) el.appendChild(h('span', 'caret'));
      if (i === row.length) break;
      var it = row[i];
      if (it.t === 'pow' && (i === 0 || isOpBefore(row[i - 1]))) el.appendChild(h('span', 'slot ghost'));
      var node = renderItem(it, path, i, live);
      if (live) node._pos = { path: path, i: i };
      el.appendChild(node);
    }
    return el;
  }
  function isOpBefore(it) { return it.t === 'f' || (it.t === 's' && /^([+−×÷(]|nCr|nPr)$/.test(it.v)); }
  function sub(path, i, k) { return path.concat([[i, k]]); }

  function renderItem(it, path, i, live) {
    var e, v = it.v;
    switch (it.t) {
      case 's':
        if (/^[0-9.]$/.test(v)) return h('span', 'd', v);
        if (v === '(' || v === ')') return h('span', 'paren', v);
        if (v === 'nCr' || v === 'nPr') return h('span', 'comb', v === 'nCr' ? 'C' : 'P');
        if (v === 'Ans' || v === 'Ran#') return h('span', 'ans', v);
        if (v === 'π' || v === 'e') return h('span', 'const', v);
        if (/^[+−×÷]$/.test(v)) return h('span', 'op', v);
        if (N.VARS.indexOf(v) >= 0) return h('span', 'var', v);
        return h('span', 'sym', v);
      case 'f':
        e = h('span', 'fn'); e.appendChild(h('span', 'fname', N.fnLabel(v))); e.appendChild(h('span', 'paren', '('));
        return e;
      case 'frac':
        e = h('span', 't-frac');
        var num = h('span', 't-num'), den = h('span', 't-den');
        num.appendChild(renderRow(it.a[0], sub(path, i, 0), live)); den.appendChild(renderRow(it.a[1], sub(path, i, 1), live));
        e.appendChild(num); e.appendChild(den);
        return e;
      case 'pow':
        e = h('span', 't-sup'); e.appendChild(renderRow(it.a[0], sub(path, i, 0), live));
        return e;
      case 'x10':
        e = h('span', 't-x10'); e.appendChild(h('span', 'x10', '×10'));
        var s = h('span', 't-sup'); s.appendChild(renderRow(it.a[0], sub(path, i, 0), live)); e.appendChild(s);
        return e;
      case 'sqrt':
        return radical(renderRow(it.a[0], sub(path, i, 0), live));
      case 'root':
        e = h('span', 't-root');
        var idx = h('span', 't-idx'); idx.appendChild(renderRow(it.a[0], sub(path, i, 0), live));
        e.appendChild(idx); e.appendChild(radical(renderRow(it.a[1], sub(path, i, 1), live)));
        return e;
      case 'logb':
        e = h('span', 't-logb'); e.appendChild(h('span', 'fname', 'log'));
        var b = h('span', 't-sub'); b.appendChild(renderRow(it.a[0], sub(path, i, 0), live)); e.appendChild(b);
        e.appendChild(h('span', 'paren', '(')); e.appendChild(renderRow(it.a[1], sub(path, i, 1), live)); e.appendChild(h('span', 'paren', ')'));
        return e;
      case 'abs':
        e = h('span', 't-abs'); e.appendChild(h('span', 'bar'));
        e.appendChild(renderRow(it.a[0], sub(path, i, 0), live)); e.appendChild(h('span', 'bar'));
        return e;
    }
    return h('span', 'sym', '?');
  }
  function radical(body) {
    var e = h('span', 't-sqrt'); e.innerHTML = RAD_SVG; e.appendChild(body);
    return e;
  }

  // Parentheses and |bars| grow to the height of what they enclose.
  function scaleParens(root) {
    root.querySelectorAll('.row, .t-logb').forEach(function (row) {
      var stack = [];
      Array.prototype.forEach.call(row.children, function (kid) {
        var p = kid.classList.contains('paren') ? kid : (kid.classList.contains('fn') ? kid.lastChild : null);
        if (p && p.textContent === '(') { stack.push({ p: p, max: 0 }); return; }
        if (p && p.textContent === ')') {
          var top = stack.pop();
          if (top) { grow([top.p, p], top.max); if (stack.length) stack[stack.length - 1].max = Math.max(stack[stack.length - 1].max, top.max); }
          return;
        }
        if (kid.classList.contains('caret') || !stack.length) return;
        stack[stack.length - 1].max = Math.max(stack[stack.length - 1].max, kid.getBoundingClientRect().height);
      });
      stack.forEach(function (s) { grow([s.p], s.max); });
    });
    root.querySelectorAll('.t-abs').forEach(function (a) {
      var inner = a.children[1].getBoundingClientRect().height;
      grow([a.children[0], a.children[2]], inner);
    });
  }
  function grow(els, max) {
    var base = els[0].getBoundingClientRect().height || 1;
    if (max > base * 1.15) els.forEach(function (e) { e.style.transform = 'scaleY(' + (max / base).toFixed(3) + ')'; });
  }

  function mathEl(row, cls) { var w = h('span', 'nat' + (cls ? ' ' + cls : '')); w.appendChild(renderRow(row, [], false)); return w; }

  // ---------- display ----------
  function render() {
    cursorKey = keyOf(ed.path);
    compute();
    $('cDisplay').classList.toggle('done-state', st.done);
    exprEl.textContent = '';
    exprEl.appendChild(renderRow(ed.root, [], true));
    scaleParens(exprEl);
    var caret = exprEl.querySelector('.caret');
    if (caret) caret.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    $('indS').hidden = !st.shift; $('indH').hidden = !st.hyp;
    $('angleBtn').textContent = st.angle.toUpperCase();
    $('cFKeys').classList.toggle('shift-on', st.shift);
    document.querySelectorAll('#cFKeys .key.shift').forEach(function (k) { k.setAttribute('aria-pressed', String(st.shift)); });
    document.querySelectorAll('#cFKeys .key.hyp').forEach(function (k) { k.setAttribute('aria-pressed', String(st.hyp)); });
    renderResult();
    store.set('calc:expr', ed.root);
  }

  function renderResult() {
    resEl.textContent = ''; altEl.textContent = '';
    resEl.className = 'cres' + (st.done ? '' : ' live');
    if (ed.isEmpty()) { resEl.classList.add('live'); resEl.appendChild(mathEl([sym('0')])); return; }
    if (st.error) {
      if (st.error.code === 'incomplete' && !st.done) { resEl.appendChild(mathEl([sym('…')])); return; }
      resEl.classList.add('err'); resEl.appendChild(h('span', 'nat', st.error.message));
      return;
    }
    var x = N.toNum(st.value), f = N.forms(st.value), row, badge = null;
    if (st.eng != null) { var g = N.eng(x, st.eng); row = g.row; badge = g.prefix; }
    else row = f.exact && !st.showDec ? f.exact : f.decimal;
    var m = mathEl(row); resEl.appendChild(m); scaleParens(m);
    if (badge) resEl.appendChild(h('span', 'pfx-badge', badge));
    // second line: the other form, and the value in SI notation with a button to send it to the SI mode
    if (f.exact && (st.showDec || st.eng != null)) altEl.appendChild(mathEl(f.exact));
    else if (f.exact) altEl.appendChild(h('span', null, '≈ ' + N.rowToString(f.decimal).replace(/×10\^\(?(-?\d+)\)?/, 'e$1')));
    var send = h('button', 'send');
    var txt = SI.format(x, 4), mm = txt.match(/^(.*?)([pnµmkMGTf]?)$/);
    send.appendChild(document.createTextNode('SI ' + mm[1]));
    if (mm[2]) send.appendChild(h('span', 'pfx', mm[2]));
    send.appendChild(document.createTextNode(' →'));
    send.title = 'Send to the SI mode';
    send.addEventListener('click', function (e) { e.stopPropagation(); PC.buzz(); PC.send('si', x); });
    altEl.appendChild(send);
  }

  // ---------- history ----------
  function renderHistory() {
    histEl.textContent = '';
    st.history.forEach(function (item) {
      var row = h('div', 'h-item'); row.tabIndex = 0;
      row.title = 'Tap to insert the result, hold to edit the expression';
      var a = h('span', 'h-expr'), b = h('span', 'h-val');
      a.appendChild(mathEl(item.tree));
      var f = N.forms(N.revive(item.v));
      b.appendChild(mathEl(f.exact || f.decimal));
      row.appendChild(a); row.appendChild(b);
      var timer = null, longFired = false;
      row.addEventListener('pointerdown', function (ev) {
        ev.preventDefault(); longFired = false;
        timer = setTimeout(function () { longFired = true; PC.buzz(); ed.load(item.tree); st.done = false; render(); }, 500);
      });
      var cancel = function () { clearTimeout(timer); };
      row.addEventListener('pointerleave', cancel); row.addEventListener('pointercancel', cancel);
      row.addEventListener('pointerup', function () { cancel(); if (!longFired) { PC.buzz(); insertValue(N.revive(item.v)); } });
      row.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { if (ev.shiftKey) { ed.load(item.tree); st.done = false; render(); } else insertValue(N.revive(item.v)); } });
      histEl.appendChild(row);
    });
    histEl.querySelectorAll('.nat').forEach(scaleParens);
    histEl.scrollTop = histEl.scrollHeight;
  }

  // Insert a value at the cursor in its exact form when it has one (fraction, surd), else as a decimal.
  function insertValue(v) {
    var f = N.forms(v);
    if (st.done) { ed.clear(); st.done = false; }
    var row = JSON.parse(JSON.stringify(f.exact || f.decimal));
    var r = ed.row(), prev = r[ed.i - 1];
    if (prev && (prev.t !== 's' || !/^([+−×÷(]|nCr|nPr)$/.test(prev.v)) && prev.t !== 'f') ed.insert('×');
    if (prev && row[0] && row[0].t === 's' && row[0].v === '−') {
      ed.insert('('); ed.insertItems(row); ed.insert(')');
    } else ed.insertItems(row);
    st.eng = null; st.showDec = false;
    render();
  }

  function commit() {
    compute();
    if (!st.value) { st.done = true; render(); st.done = false; return; }
    st.history.push({ tree: JSON.parse(JSON.stringify(ed.root)), v: N.freeze(st.value) });
    if (st.history.length > 50) st.history = st.history.slice(-50);
    store.set('calc:history', st.history);
    PC.setAns(st.value);
    st.done = true; st.showDec = false; st.eng = null;
    renderHistory(); render();
  }

  // ---------- keys ----------
  // a: action, l: label (HTML, constants only), s: SHIFT action, sl: SHIFT label, c: extra class
  var BOX = '<span class="kbox"></span>';
  var FKEYS = [
    { a: 'shift', l: 'SHIFT', c: 'shift nav' }, { a: 'var', l: 'VAR', s: 'sto', sl: 'STO' },
    { a: 'left', l: '◀', c: 'nav', aria: 'Cursor left' }, { a: 'right', l: '▶', c: 'nav', aria: 'Cursor right' },
    { a: 'up', l: '▲', c: 'nav', aria: 'Cursor up' }, { a: 'down', l: '▼', c: 'nav', aria: 'Cursor down' },

    { a: 'tpl:frac', l: '<span class="kfrac"><i></i><b></b><i></i></span>', s: 'tpl:root', sl: '<sup>x</sup>√' + BOX, aria: 'Fraction' },
    { a: 'tpl:sqrt', l: '√' + BOX, s: 'tpl:cbrt', sl: '∛' + BOX, aria: 'Square root' },
    { a: 'tpl:sq', l: 'x²', s: 'tpl:cube', sl: 'x³' },
    { a: 'tpl:pow', l: 'x<sup>y</sup>', s: 'tpl:p10', sl: '10<sup>x</sup>', aria: 'Power' },
    { a: 'fn:log', l: 'log', s: 'tpl:logb', sl: 'log<sub>a</sub>b' },
    { a: 'fn:ln', l: 'ln', s: 'tpl:exp', sl: 'e<sup>x</sup>' },

    { a: 'fn:sin', l: 'sin', s: 'fn:asin', sl: 'sin⁻¹' }, { a: 'fn:cos', l: 'cos', s: 'fn:acos', sl: 'cos⁻¹' },
    { a: 'fn:tan', l: 'tan', s: 'fn:atan', sl: 'tan⁻¹' },
    { a: 'sym:(', l: '(', s: 'tpl:abs', sl: 'Abs' }, { a: 'sym:)', l: ')' },
    { a: 'tpl:inv', l: 'x⁻¹', s: 'sym:!', sl: 'x!' },

    { a: 'hyp', l: 'hyp', c: 'hyp' }, { a: 'sym:π', l: 'π', s: 'sym:e', sl: 'e' },
    { a: 'sym:nCr', l: 'nCr', s: 'sym:nPr', sl: 'nPr' }, { a: 'sym:%', l: '%', s: 'sym:Ran#', sl: 'Ran#' },
    { a: 'sd', l: 'S⇔D', aria: 'Switch exact and decimal' }, { a: 'eng', l: 'ENG', s: 'engl', sl: '←ENG' }
  ];
  var NKEYS = [
    { a: 'sym:7', l: '7' }, { a: 'sym:8', l: '8' }, { a: 'sym:9', l: '9' }, { a: 'bs', l: '⌫', c: 'fn', aria: 'Delete' }, { a: 'ac', l: 'AC', c: 'fn ac' },
    { a: 'sym:4', l: '4' }, { a: 'sym:5', l: '5' }, { a: 'sym:6', l: '6' }, { a: 'sym:×', l: '×', c: 'op' }, { a: 'sym:÷', l: '÷', c: 'op' },
    { a: 'sym:1', l: '1' }, { a: 'sym:2', l: '2' }, { a: 'sym:3', l: '3' }, { a: 'sym:+', l: '+', c: 'op' }, { a: 'sym:−', l: '−', c: 'op' },
    { a: 'sym:0', l: '0' }, { a: 'sym:.', l: '.' }, { a: 'tpl:x10', l: '×10<sup>x</sup>', c: 'fn x10k', aria: 'Times ten to the power' },
    { a: 'sym:Ans', l: 'Ans', c: 'fn ansk' }, { a: 'eq', l: '=', c: 'eq' }
  ];
  function buildKeys(box, defs, fkey) {
    defs.forEach(function (d) {
      var b = h('label', 'key' + (fkey ? ' f' : '') + (d.c ? ' ' + d.c : ''));
      b.innerHTML = (d.sl ? '<span class="sl">' + d.sl + '</span>' : '') + '<span class="ml">' + d.l + '</span>';
      if (d.aria) b.setAttribute('aria-label', d.aria);
      b.dataset.a = d.a;
      PC.tactile(b);
      b.addEventListener('pointerdown', function (ev) { ev.preventDefault(); });
      b.addEventListener('click', function () { PC.buzz(); press(d); });
      box.appendChild(b);
    });
  }

  var CONTINUE = /^(sym:([+−×÷!%]|nCr|nPr)|tpl:(pow|sq|cube|inv|frac))$/;
  var BINARY = /^(sym:([+×÷!%]|nCr|nPr)|tpl:(pow|sq|cube|inv))$/;
  var HYP = { sin: 'sinh', cos: 'cosh', tan: 'tanh', asin: 'asinh', acos: 'acosh', atan: 'atanh' };

  function press(d) {
    var a = st.shift && d.s ? d.s : d.a;
    if (a !== 'shift') st.shift = false;
    run(a);
  }
  function run(a) {
    var parts = a.split(':'), kind = parts[0], arg = parts.slice(1).join(':');
    switch (a) {
      case 'shift': st.shift = !st.shift; render(); return;
      case 'hyp': st.hyp = !st.hyp; render(); return;
      case 'left': st.done = false; ed.left(); render(); return;
      case 'right': st.done = false; ed.right(); render(); return;
      case 'up': st.done = false; ed.vertical(-1); render(); return;
      case 'down': st.done = false; ed.vertical(1); render(); return;
      case 'ac': ed.clear(); st.done = false; st.eng = null; st.showDec = false; render(); return;
      case 'bs': if (st.done) { st.done = false; ed.toEnd(); } ed.backspace(); render(); return;
      case 'eq': commit(); return;
      case 'sd': if (st.value) { st.showDec = !st.showDec; st.eng = null; render(); } return;
      case 'eng': if (st.value) { st.eng = st.eng == null ? 0 : st.eng + 1; render(); } return;
      case 'engl': if (st.value) { st.eng = st.eng == null ? 0 : st.eng - 1; render(); } return;
      case 'var': openVars(null); return;
      case 'sto': openVars('sto'); return;
    }
    // input keys: after "=" an operator continues from Ans, anything else starts a new line
    if (st.done) {
      ed.clear();
      if (CONTINUE.test(a)) ed.insert('Ans');
      st.done = false;
    } else if (ed.isEmpty() && BINARY.test(a) && PC.ans) ed.insert('Ans');
    st.eng = null; st.showDec = false;
    if (kind === 'sym') ed.insert(arg);
    else if (kind === 'fn') { var name = st.hyp && HYP[arg] ? HYP[arg] : arg; st.hyp = false; ed.insertFunc(name); }
    else if (kind === 'tpl') insertTemplate(arg);
    render();
  }
  function insertTemplate(t) {
    var r = ed.row(), prev = r[ed.i - 1];
    switch (t) {
      case 'sq': ed.insertTemplate('pow', [[sym('2')]]); return;
      case 'cube': ed.insertTemplate('pow', [[sym('3')]]); return;
      case 'inv': ed.insertTemplate('pow', [[sym('−'), sym('1')]]); return;
      case 'cbrt': ed.insertTemplate('root', [[sym('3')]]); return;
      case 'p10':

        ed.insert('1'); ed.insert('0'); ed.insertTemplate('pow'); return;
      case 'exp': ed.insert('e'); ed.insertTemplate('pow'); return;

  }

  // ---------- variables panel (VAR inserts, STO stores the result, M+ / M−) ----------
  var panel = null;
  function shortVal(o) { if (!o) return '0'; var v = N.revive(o), f = N.forms(v); return N.rowToString(f.exact || f.decimal); }
  function openVars(mode) {
    closeVars();
    st.varMode = mode;
    $('indSto').hidden = mode !== 'sto';
    panel = h('div', 'varpanel'); panel.setAttribute('role', 'dialog'); panel.setAttribute('aria-label', mode === 'sto' ? 'Store result in' : 'Variables');
    var head = h('div', 'vp-head');
    head.appendChild(h('span', null, mode === 'sto' ? 'Store the result in…' : 'Tap to insert'));
    var close = h('button', 'chip', 'Close'); close.addEventListener('click', function () { PC.buzz(); closeVars(); });
    head.appendChild(close); panel.appendChild(head);
    N.VARS.forEach(function (name) {
      var b = h('button', 'v'); b.appendChild(h('b', null, name)); b.appendChild(document.createTextNode(shortVal(st.vars[name])));
      b.addEventListener('click', function () {
        PC.buzz();
        if (st.varMode === 'sto') store1(name, currentValue(), 'set');
        else { closeVars(); run('sym:' + name); }
      });
      panel.appendChild(b);
    });
    var acts = h('div', 'vp-actions');
    [['M+', 'add'], ['M−', 'sub'], ['Clear all', 'clear']].forEach(function (x) {
      var b = h('button', 'chip', x[0]);
      b.addEventListener('click', function () {
        PC.buzz();
        if (x[1] === 'clear') { st.vars = {}; store.set('vars', st.vars); openVars(st.varMode); return; }
        store1('M', currentValue(), x[1]);
      });
      acts.appendChild(b);
    });
    panel.appendChild(acts);
    $('cFKeys').appendChild(panel);
  }
  function closeVars() { if (panel) panel.remove(); panel = null; st.varMode = null; $('indSto').hidden = true; }
  function currentValue() { compute(); return st.value || (PC.ans ? N.revive(PC.ans) : null); }
  function store1(name, v, how) {
    if (!v) { PC.toast('Nothing to store yet'); return; }
    var old = st.vars[name] ? N.revive(st.vars[name]) : N.revive({ n: '0', d: '1' });
    var nv = how === 'add' ? N.add(old, v) : how === 'sub' ? N.sub(old, v) : v;
    st.vars[name] = N.freeze(nv); store.set('vars', st.vars);
    closeVars();
    PC.toast(name + ' = ' + shortVal(st.vars[name]));
  }

  // ---------- pointer: tap places the cursor, swipe moves it ----------
  (function () {
    var x0 = null, moved = 0, swiped = false;
    exprEl.addEventListener('pointerdown', function (e) { x0 = e.clientX; moved = 0; swiped = false; });
    exprEl.addEventListener('pointermove', function (e) {
      if (x0 == null || e.pointerType === 'mouse') return;
      var steps = Math.trunc((e.clientX - x0) / 18);
      while (moved < steps) { ed.right(); moved++; swiped = true; }
      while (moved > steps) { ed.left(); moved--; swiped = true; }
      if (swiped) { st.done = false; PC.buzz(); render(); }
    });
    exprEl.addEventListener('pointerup', function (e) {
      var was = x0; x0 = null;
      if (was == null || swiped) return;
      var t = e.target;
      while (t && t !== exprEl && !t._pos && !t._slot) t = t.parentNode;
      st.done = false;
      if (!t || t === exprEl) { ed.toEnd(); if (ed.root.length && e.clientX < exprEl.getBoundingClientRect().left + 40) ed.setCursor([], 0); }
      else if (t._slot) ed.setCursor(t._slot, 0);
      else { var r = t.getBoundingClientRect(); ed.setCursor(t._pos.path, t._pos.i + (e.clientX > r.left + r.width / 2 ? 1 : 0)); }
      render();
    });
    exprEl.addEventListener('pointercancel', function () { x0 = null; });
  })();

  // tap the result to copy it (full precision decimal)
  resEl.addEventListener('click', function () {
    if (!st.value) return;
    var x = N.toNum(st.value), text = String(Number(x.toPrecision(15)));
    var done = function () { PC.toast('Copied: ' + text); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { PC.toast('Copy failed'); });
    else PC.toast('Copy failed');
  });
  $('angleBtn').addEventListener('click', function () {
    st.angle = { deg: 'rad', rad: 'gra', gra: 'deg' }[st.angle]; store.set('angle', st.angle); PC.buzz(); render();
  });

  // hardware keyboard
  var KB = { '*': 'sym:×', 'x': 'sym:×', '/': 'tpl:frac', '-': 'sym:−', '+': 'sym:+', '^': 'tpl:pow', '(': 'sym:(', ')': 'sym:)', '!': 'sym:!', '%': 'sym:%', '.': 'sym:.', ',': 'sym:.' };
  document.addEventListener('keydown', function (ev) {
    if (PC.current !== 'calc' || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var k = ev.key, a = null;
    if (/^[0-9]$/.test(k)) a = 'sym:' + k;
    else if (KB[k]) a = KB[k];
    else if (k === 'Enter' || k === '=') a = 'eq';
    else if (k === 'Backspace') a = 'bs';
    else if (k === 'Escape') a = panel ? null : 'ac';
    else if (k === 'ArrowLeft') a = 'left'; else if (k === 'ArrowRight') a = 'right';
    else if (k === 'ArrowUp') a = 'up'; else if (k === 'ArrowDown') a = 'down';
    if (k === 'Escape' && panel) { ev.preventDefault(); closeVars(); return; }
    if (!a) return;
    ev.preventDefault(); run(a);
  });

  buildKeys($('cFKeys'), FKEYS, true);
  buildKeys($('cNKeys'), NKEYS, false);
  renderHistory();

  PC.register({
    id: 'calc', title: 'Calc', el: $('mode-calc'),
    show: function () { render(); renderHistory(); },
    accept: function (v) { insertValue(typeof v === 'number' ? N.revive({ f: v }) : v); },
    clearHistory: function () { st.history = []; store.set('calc:history', []); renderHistory(); }
  });
})();

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var input = $('expr'), resultEl = $('result'), altsEl = $('alts'), evalEl = $('eval'), histEl = $('history');
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem('prefixcalc:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('prefixcalc:' + k, JSON.stringify(v)); } catch (e) {} }
  };
  var state = { value: null, shift: 0, series: store.get('series', 'E24'), haptic: store.get('haptic', true), history: store.get('history', []) };
  var SIG = 4;

  function buzz() { PC.buzz(); }

  // ---------- editing at the caret ----------
  function sel() { return { s: input.selectionStart == null ? input.value.length : input.selectionStart, e: input.selectionEnd == null ? input.value.length : input.selectionEnd }; }
  function setCaret(p) { try { input.setSelectionRange(p, p); } catch (e) {} }
  function insert(txt) {
    var r = sel(), v = input.value;
    input.value = v.slice(0, r.s) + txt + v.slice(r.e);
    setCaret(r.s + txt.length);
    changed();
  }
  function backspace() {
    var r = sel(), v = input.value;
    if (r.s !== r.e) { input.value = v.slice(0, r.s) + v.slice(r.e); setCaret(r.s); }

      if (hit) html += '<button class="chip" data-q="' + q.id + '" aria-pressed="' + (q.id === st.q) + '">' + esc(q.name) + '</button>';
    });
    box.innerHTML = html || '<span class="u-note2">No quantity or unit matches “' + esc($('uSearch').value.trim()) + '”.</span>';
    var on = box.querySelector('[aria-pressed="true"]'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
  function renderFavs() {
    $('uFavs').innerHTML = st.favs.map(function (f, i) {
      try { var q = U.quantity(f.q); return '<button class="chip" data-fav="' + i + '" title="' + esc(q.name) + '">★ ' + esc(U.unit(q, f.u).sym) + ' → ' + esc(U.unit(q, f.to).sym) + '</button>'; } catch (e) { return ''; }
    }).join('');
  }
  function renderSelects() {
    var q = U.quantity(st.q), x = U.unit(q, st.u);
    $('uUnit').innerHTML = ['metric', 'imperial'].map(function (s) {
      return '<optgroup label="' + (s === 'metric' ? 'Metric' : 'Imperial') + '">' + q.units.filter(function (y) { return y.sys === s; }).map(function (y) {
        return '<option value="' + esc(y.id) + '"' + (y.id === st.u ? ' selected' : '') + ' title="' + esc(y.name) + '">' + esc(y.sym) + '</option>';
      }).join('') + '</optgroup>';
    }).join('');
    var ps = U.prefixesFor(x);
    $('uPfx').hidden = ps.length < 2;
    if (ps.indexOf(st.e3) < 0) st.e3 = 0;
    $('uPfx').innerHTML = ps.map(function (e) { return '<option value="' + e + '"' + (e === st.e3 ? ' selected' : '') + '>' + (e ? U.PREFIX_SYM[e] : '×1') + '</option>'; }).join('');
  }
  function lengthNote(r, b) {
    if (r.unit.id === 'in' && st.q === 'length') { var f = U.inchFraction(U.fromBase(r.unit, b, 0), st.den); return f.text + (Math.abs(f.error) > 1e-9 ? ' (' + (f.error > 0 ? '+' : '−') + Math.abs(f.error).toFixed(4) + '")' : ''); }
    if (r.unit.id === 'ft' && st.q === 'length') return U.feetInches(b, st.den).text;
    return '';
  }
  var last = null;
  function compute() {
    var q = U.quantity(st.q), x = U.unit(q, st.u), list = $('uList'), status = $('uStatus');
    last = null; status.className = 'tool-status'; $('uVal').removeAttribute('aria-invalid');
    if (!st.text.trim()) { status.textContent = 'Enter a value to convert.'; list.innerHTML = ''; $('uBest').hidden = true; return; }
    var v, rows, best, b;
    try {
      v = U.parseInput(st.text, q.id, x.id);
      b = U.toBase(q, x, v, st.e3);
      rows = U.results(q.id, v, x.id, st.e3, { system: st.sys });
      best = U.bestOther(q.id, v, x.id, st.e3, st.pref[q.id + ':' + other(x.sys)]);
    } catch (e) {
      status.textContent = e.message; status.className = 'tool-status err'; $('uVal').setAttribute('aria-invalid', 'true');
      list.innerHTML = ''; $('uBest').hidden = true; return;
    }
    status.textContent = '';
    last = { q: q, x: x, v: v, b: b, best: best, rows: rows };
    $('uBest').hidden = false;
    $('uBestLbl').textContent = (best.unit.sys === 'metric' ? 'Metric' : 'Imperial') + ' · best fit';
    $('uBestVal').innerHTML = esc(num(best.value)) + ' ' + symHtml(best.unit, best.e3);
    $('uBestNote').textContent = lengthNote(best, b);
    var key = q.id + '|' + x.id + '|' + best.unit.id, starred = st.favs.some(function (f) { return f.q + '|' + f.u + '|' + f.to === key; });
    $('uStar').setAttribute('aria-pressed', String(starred)); $('uStar').textContent = starred ? '★' : '☆';
    var html = '';
    ['metric', 'imperial'].forEach(function (s) {
      var rs = rows.filter(function (r) { return r.unit.sys === s; });
      if (!rs.length) return;
      html += '<p class="step u-group">' + (s === 'metric' ? 'Metric' : 'Imperial') + '</p>';
      rs.forEach(function (r) {
        var i = rows.indexOf(r), note = lengthNote(r, b);
        html += '<div class="u-row' + (r.unit.id === x.id ? ' src' : '') + '" data-i="' + i + '" role="button" tabindex="0" aria-label="Use ' + esc(r.unit.name) + ' as input">' +
          '<span class="u-sym">' + symHtml(r.unit, r.e3) + (r.unit === best.unit ? '<span class="tag">best</span>' : '') + '</span>' +
          '<span class="u-name">' + esc(r.unit.name) + '</span>' +
          '<span class="u-val">' + esc(num(r.value)) + (note ? '<small>' + esc(note) + '</small>' : '') + '</span>' +
          '<button class="cp" data-cp="' + i + '" aria-label="Copy ' + esc(r.unit.name) + ' value" title="Copy">⧉</button></div>';
      });
    });
    list.innerHTML = html;
  }
  function useRow(r) {
    buzz();
    st.u = r.unit.id; st.e3 = r.e3; st.text = U.format(r.value, 10);
    $('uVal').value = st.text; save(); renderSelects(); compute();
  }
  function renderConvert() {
    setSeg('uSys', st.sys); setSeg('uSig', st.sig); setSeg('uDen', st.den);
    $('uDen').hidden = st.q !== 'length';
    if (document.activeElement !== $('uVal')) $('uVal').value = st.text;
    renderQs(); renderFavs(); renderSelects(); compute();
  }
  function pickQuantity(id, unitId) {
    var q = U.quantity(id);
    st.q = id; st.u = unitId || q.units[0].id; st.e3 = unitId ? 0 : (q.units[0].base || 0);
    save(); renderConvert();
  }
  $('uQs').addEventListener('click', function (e) { var b = e.target.closest('[data-q]'); if (b) { buzz(); pickQuantity(b.dataset.q); } });
  $('uFavs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-fav]'); if (!b) return;
    var f = st.favs[+b.dataset.fav]; buzz();
    st.pref[f.q + ':' + U.unit(f.q, f.to).sys] = f.to; pickQuantity(f.q, f.u);
  });
  $('uSearch').addEventListener('input', function () {
    var s = this.value.trim(), hit = null;
    if (s) U.QUANTITIES.forEach(function (q) { q.units.forEach(function (x) { if (!hit && x.sym === s) hit = [q.id, x.id]; }); });
    if (s && !hit) U.QUANTITIES.forEach(function (q) { q.units.forEach(function (x) { if (!hit && x.sym.toLowerCase() === s.toLowerCase()) hit = [q.id, x.id]; }); });
    if (hit && (hit[0] !== st.q || hit[1] !== st.u)) { st.q = hit[0]; st.u = hit[1]; st.e3 = 0; save(); renderSelects(); compute(); $('uDen').hidden = st.q !== 'length'; }
    renderQs();
  });
  $('uVal').addEventListener('input', function () { st.text = this.value; save(); compute(); });
  $('uUnit').addEventListener('change', function () {
    var x = U.unit(st.q, this.value); st.u = x.id; st.e3 = x.base && U.prefixesFor(x).indexOf(x.base) >= 0 ? x.base : 0;
    save(); renderSelects(); compute();
  });
  $('uPfx').addEventListener('change', function () { st.e3 = +this.value; save(); compute(); });
  $('uList').addEventListener('click', function (e) {
    var c = e.target.closest('[data-cp]');
    if (c && last) { var r = last.rows[+c.dataset.cp]; buzz(); copy(num(r.value) + ' ' + U.symbol(r.unit, r.e3)); return; }
    var row = e.target.closest('.u-row'); if (row && last) useRow(last.rows[+row.dataset.i]);
  });
  $('uList').addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('u-row') && last) { e.preventDefault(); useRow(last.rows[+e.target.dataset.i]); }
  });
  $('uSwap').addEventListener('click', function () {
    if (!last) return;
    st.pref[last.q.id + ':' + last.x.sys] = last.x.id;
    useRow(last.best);
  });
  $('uStar').addEventListener('click', function () {
    if (!last) return; buzz();
    var key = last.q.id + '|' + last.x.id + '|' + last.best.unit.id, i = -1;
    st.favs.forEach(function (f, j) { if (f.q + '|' + f.u + '|' + f.to === key) i = j; });
    if (i >= 0) { st.favs.splice(i, 1); PC.toast('Removed from starred'); }
    else { st.favs.push({ q: last.q.id, u: last.x.id, to: last.best.unit.id }); st.pref[last.q.id + ':' + last.best.unit.sys] = last.best.unit.id; PC.toast('Starred'); }
    save(); renderFavs(); compute();
  });
  [['uSys', 'sys', false], ['uSig', 'sig', true], ['uDen', 'den', true]].forEach(function (s) {
    $(s[0]).addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return; buzz();
      st[s[1]] = s[2] ? +b.dataset.v : b.dataset.v; save(); setSeg(s[0], st[s[1]]); compute();
    });
  });

  // ---------- small field forms (Decibels, Wire & trace) ----------
  // A mode lists fields; fields marked solve form a group where the one the person typed in is the source and
  // the others are calculated in place (shown dashed, as in Tools).
  function parseNum(s) { var v = SI.evaluate(s); return v; }
  function makeForm(cfg) {
    var S = st[cfg.key];
    function mode() { return cfg.modes[S.m]; }
    function render() {
      document.querySelectorAll('#' + cfg.modesEl + ' button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.m === S.m)); });
      var m = mode(), T = S.text[S.m] || (S.text[S.m] = {});
      $(cfg.hintEl).textContent = m.hint;
      $(cfg.fieldsEl).innerHTML = m.fields.map(function (f) {
        var id = cfg.key + '-' + f.id, lab = '<label for="' + id + '">' + esc(f.label) + (f.unit ? ' <span class="unit">' + esc(f.unit) + '</span>' : '') + (f.opt ? ' <span class="opt">optional</span>' : '') + '</label>';
        var ctl = f.opts ? '<select id="' + id + '" data-f="' + f.id + '">' + f.opts.map(function (o) { return '<option value="' + esc(o[0]) + '">' + esc(o[1]) + '</option>'; }).join('') + '</select>'
          : '<input id="' + id + '" data-f="' + f.id + '" inputmode="text" autocomplete="off" spellcheck="false" placeholder="' + esc(f.ph || '') + '">';
        return '<div class="field">' + lab + ctl + '</div>';
      }).join('');
      m.fields.forEach(function (f) {
        var el = $(cfg.key + '-' + f.id), v = T[f.id] !== undefined ? T[f.id] : (f.def !== undefined ? f.def : '');
        if (f.opts) el.value = v || f.opts[0][0]; else el.value = v;
      });
      run();
    }
    function run() {
      var m = mode(), T = S.text[S.m], vals = {}, bad = null, src = S.src[S.m] || m.defSrc;
      m.fields.forEach(function (f) {
        var el = $(cfg.key + '-' + f.id); el.removeAttribute('aria-invalid'); el.classList.remove('computed');
        if (f.solve && f.id !== src) return;
        var s = el.value.trim();
        if (f.opts) { vals[f.id] = el.value; return; }
        if (!s) { vals[f.id] = null; return; }
        try { vals[f.id] = parseNum(s); } catch (e) { if (!bad) bad = [f, e.message]; el.setAttribute('aria-invalid', 'true'); }
      });
      var status = $(cfg.statusEl), out = $(cfg.outEl);
      status.className = 'tool-status';
      var r = null;
      if (bad) { status.textContent = bad[0].label + ': ' + bad[1]; status.className = 'tool-status err'; }
      else {
        try { r = m.solve(vals, src); status.textContent = ''; }
        catch (e) { status.textContent = e.message; status.className = 'tool-status err'; var se = $(cfg.key + '-' + src); if (se && se.tagName === 'INPUT') se.setAttribute('aria-invalid', 'true'); }
      }
      m.fields.forEach(function (f) {
        if (!f.solve || f.id === src) return;
        var el = $(cfg.key + '-' + f.id);
        if (document.activeElement === el) return;
        el.value = r && r.set && r.set[f.id] !== undefined ? r.set[f.id] : '';
        if (!f.opts) el.classList.add('computed');
      });
      if (r && r.out && r.out.length) {
        out.hidden = false;
        out.innerHTML = '<p class="step">Result</p><div class="u-out">' + r.out.map(function (kv) { return '<div class="u-kv"><span>' + esc(kv[0]) + '</span><b>' + esc(kv[1]) + '</b></div>'; }).join('') + '</div>' +
          (r.warn || []).map(function (w) { return '<p class="u-warn">' + esc(w) + '</p>'; }).join('') + (r.note ? '<p class="u-note2" style="margin:6px 0">' + esc(r.note) + '</p>' : '');
      } else out.hidden = true;
    }
    $(cfg.fieldsEl).addEventListener('input', function (e) {
      var id = e.target.dataset.f; if (!id || e.target.tagName === 'SELECT') return;
      var m = mode(), f = m.fields.filter(function (x) { return x.id === id; })[0];
      S.text[S.m][id] = e.target.value;
      if (f.solve) { S.src[S.m] = id; m.fields.forEach(function (o) { if (o.solve && o.id !== id) delete S.text[S.m][o.id]; }); }
      save(); run();
    });
    $(cfg.fieldsEl).addEventListener('change', function (e) {
      if (e.target.tagName !== 'SELECT') return;
      var id = e.target.dataset.f, m = mode(), f = m.fields.filter(function (x) { return x.id === id; })[0];
      S.text[S.m][id] = e.target.value;
      if (f.solve) { S.src[S.m] = id; m.fields.forEach(function (o) { if (o.solve && o.id !== id) delete S.text[S.m][o.id]; }); }
      save(); run();
    });
    document.querySelectorAll('#' + cfg.modesEl + ' button').forEach(function (b) {
      b.addEventListener('click', function () { buzz(); S.m = b.dataset.m; save(); render(); });
    });
    return { render: render };
  }
  function need(v, msg) { if (v === null || v === undefined) throw new U.UnitError(msg); return v; }
  var fdb = function (x) { return String(Number(x.toFixed(4))); };
  var fsi = function (x) { return SI.format(x, 5); };
  var fn = function (x) { return U.format(x, 6); };
  var D = U.DB;

  var dbForm = makeForm({ key: 'db', modesEl: 'uDbModes', hintEl: 'uDbHint', fieldsEl: 'uDbFields', statusEl: 'uDbStatus', outEl: 'uDbOut', modes: {
    ratio: { hint: 'Type in any field. Power: dB = 10·log(P₂/P₁). Voltage or current: dB = 20·log(V₂/V₁).', defSrc: 'db',
      fields: [{ id: 'db', label: 'Gain', unit: 'dB', solve: true, def: '3' }, { id: 'pr', label: 'Power ratio', unit: '×', solve: true }, { id: 'vr', label: 'Voltage ratio', unit: '×', solve: true }],
      solve: function (v, src) {
        var x = need(v[src], 'Enter a value');
        var db = src === 'db' ? x : src === 'pr' ? D.fromPowerRatio(x) : D.fromVoltageRatio(x);
        return { set: { db: fdb(db), pr: fn(D.toPowerRatio(db)), vr: fn(D.toVoltageRatio(db)) } };
      } },
    level: { hint: 'Type in any level. Power ↔ voltage uses the load impedance (50 Ω RF, 75 Ω video, 600 Ω audio). Prefixes work: 10m = 10 mW.', defSrc: 'dbm',
      fields: [{ id: 'r', label: 'Load', unit: 'Ω', def: '50' }, { id: 'dbm', label: 'Power', unit: 'dBm', solve: true, def: '0' }, { id: 'dbw', label: 'Power', unit: 'dBW', solve: true },
        { id: 'w', label: 'Power', unit: 'W', solve: true }, { id: 'vrms', label: 'Voltage', unit: 'V rms', solve: true }, { id: 'dbv', label: 'Voltage', unit: 'dBV', solve: true },
        { id: 'dbu', label: 'Voltage', unit: 'dBu', solve: true }, { id: 'dbuv', label: 'Voltage', unit: 'dBµV', solve: true }],
      solve: function (v, src) {
        var x = need(v[src], 'Enter a value'), R = need(v.r, 'Enter the load impedance');
        var w = { dbm: function () { return D.dBmToW(x); }, dbw: function () { return D.dBWToW(x); }, w: function () { return x; },
          vrms: function () { return D.vrmsToW(x, R); }, dbv: function () { return D.vrmsToW(D.dBVToV(x), R); },
          dbu: function () { return D.vrmsToW(D.dBuToV(x), R); }, dbuv: function () { return D.vrmsToW(D.dBuVToV(x), R); } }[src]();
        var vr = D.wToVrms(w, R);
        return { set: { dbm: fdb(D.wToDBm(w)), dbw: fdb(D.wToDBW(w)), w: fsi(w), vrms: fsi(vr), dbv: fdb(D.vToDBV(vr)), dbu: fdb(D.vToDBu(vr)), dbuv: fdb(D.vToDBuV(vr)) },
          out: [['Peak voltage (sine)', fsi(D.peak(vr)) + 'V'], ['Peak-to-peak', fsi(D.peakToPeak(vr)) + 'V'], ['Current', fsi(vr / R) + 'A']] };
      } },
    sum: { hint: 'Adds uncorrelated powers: 0 dBm + 0 dBm = 3.01 dBm. Fill in two or more levels.', defSrc: null,
      fields: [{ id: 'a', label: 'Level 1', unit: 'dBm', def: '0' }, { id: 'b', label: 'Level 2', unit: 'dBm', def: '0' }, { id: 'c', label: 'Level 3', unit: 'dBm', opt: true }, { id: 'd', label: 'Level 4', unit: 'dBm', opt: true }],
      solve: function (v) {
        var ls = ['a', 'b', 'c', 'd'].map(function (k) { return v[k]; }).filter(function (x) { return x !== null && x !== undefined; });
        if (ls.length < 2) throw new U.UnitError('Fill in at least two levels');
        var t = D.powerSum(ls);
        return { out: [['Total', fdb(t) + ' dBm'], ['Total power', fsi(D.dBmToW(t)) + 'W']] };
      } }
  } });

  var awgOpts = []; for (var n = -3; n <= 40; n++) awgOpts.push([String(n), 'AWG ' + U.awgLabel(n)]);
  var ozOpts = [['1', '1 oz (35 µm)'], ['0.5', '½ oz (18 µm)'], ['2', '2 oz (70 µm)'], ['3', '3 oz (105 µm)']];
  var wireForm = makeForm({ key: 'wire', modesEl: 'uWireModes', hintEl: 'uWireHint', fieldsEl: 'uWireFields', statusEl: 'uWireStatus', outEl: 'uWireOut', modes: {
    trace: { hint: 'IPC-2221. Enter the current to get the minimum width, or a width to get the maximum current.', defSrc: 'i',
      fields: [{ id: 'i', label: 'Current', unit: 'A', solve: true, def: '1' }, { id: 'w', label: 'Width', unit: 'mm', solve: true },
        { id: 'dt', label: 'Temperature rise', unit: '°C', def: '10' }, { id: 'oz', label: 'Copper', opts: ozOpts },
        { id: 'layer', label: 'Layer', opts: [['external', 'External'], ['internal', 'Internal']] }, { id: 'len', label: 'Length', unit: 'mm', opt: true }],
      solve: function (v, src) {
        var o = { dT: need(v.dt, 'Enter the temperature rise'), oz: +v.oz, layer: v.layer }, set = {}, x = need(v[src], 'Enter a value');
        if (src === 'w') { o.current = U.traceCurrent({ widthMm: x, dT: o.dT, oz: o.oz, layer: o.layer }).current; set.i = SI.format(o.current, 4); }
        else o.current = x;
        if (v.len) o.length = v.len / 1000;
        var r = U.traceWidth(o);
        if (src !== 'w') set.w = U.format(r.widthMm, 4);
        var out = [['Minimum width', U.format(r.widthMm, 4) + ' mm  ·  ' + U.format(r.widthMil, 4) + ' mil'], ['Cross-section', U.format(r.areaMil2, 4) + ' mil²  ·  ' + U.format(r.areaMm2, 4) + ' mm²']];
        if (src === 'w') out.unshift(['Maximum current', SI.format(o.current, 4) + 'A']);
        if (r.resistance !== undefined) out.push(['Resistance (at 25 °C + rise)', fsi(r.resistance) + 'Ω'], ['Voltage drop', fsi(r.voltageDrop) + 'V'], ['Power loss', fsi(r.powerLoss) + 'W']);
        return { set: set, out: out, warn: r.warnings, note: 'IPC-2221 is conservative; IPC-2152 usually allows narrower traces.' };
      } },
    awg: { hint: 'Pick a gauge, or type a cross-section or diameter to find the nearest gauge.', defSrc: 'g',
      fields: [{ id: 'g', label: 'Gauge', opts: awgOpts, solve: true, def: '24' }, { id: 'a', label: 'Cross-section', unit: 'mm²', solve: true }, { id: 'd', label: 'Diameter', unit: 'mm', solve: true }],
      solve: function (v, src) {
        var w, extra = [];
        if (src === 'g') w = U.awg(+v.g);
        else {
          var f = src === 'a' ? U.fromArea(need(v.a, 'Enter a cross-section')) : U.fromDiameter(need(v.d, 'Enter a diameter'));
          w = f.nearest;
          extra = [['Nearest AWG', 'AWG ' + w.label], ['Smallest AWG at least this big', f.atLeast ? 'AWG ' + f.atLeast.label : 'larger than 4/0'],
            ['Nearest IEC size', f.iecNearest + ' mm²'], ['IEC size at least this big', f.iecAtLeast ? f.iecAtLeast + ' mm²' : 'larger than 120 mm²']];
        }
        var set = { g: String(w.n) };
        if (src !== 'a') set.a = U.format(w.areaMm2, 4);
        if (src !== 'd') set.d = U.format(w.diameterMm, 4);
        return { set: set, out: extra.concat([['AWG ' + w.label + ' diameter', U.format(w.diameterMm, 4) + ' mm  ·  ' + U.format(w.diameterMil, 4) + ' mil'],
          ['Area', U.format(w.areaMm2, 4) + ' mm²  ·  ' + U.format(w.kcmil, 4) + ' kcmil'], ['Copper resistance (20 °C)', U.format(w.ohmPerKm, 4) + ' Ω/km  ·  ' + U.format(w.ohmPer1000ft, 4) + ' Ω/kft']]),
          note: 'Ampacity is not shown: it depends on insulation, bundling and the standard. Check the voltage drop instead.' };
      } },
    drop: { hint: 'Copper wire, round trip (out and back) at 20 °C.', defSrc: null,
      fields: [{ id: 'a', label: 'Cross-section', unit: 'mm²', def: '1.5' }, { id: 'len', label: 'Length, one way', unit: 'm', def: '10' }, { id: 'i', label: 'Current', unit: 'A', def: '5' }, { id: 'v', label: 'Supply', unit: 'V', opt: true, def: '12' }],
      solve: function (v) {
        var r = U.voltageDrop({ areaMm2: need(v.a, 'Enter a cross-section'), length: need(v.len, 'Enter the length'), current: need(v.i, 'Enter the current'), supply: v.v || 0 });
        var out = [['Wire resistance', fsi(r.resistance) + 'Ω'], ['Voltage drop', fsi(r.drop) + 'V']];
        if (r.percent !== null) out.push(['Drop of supply', r.percent.toFixed(2) + ' %']);
        out.push(['Power lost in wire', fsi(r.drop * v.i) + 'W']);
        return { out: out };
      } }
  } });

  PC.register({ id: 'units', title: 'Units', el: $('mode-units'), show: function () { showTab(st.tab); } });
})();
</script>
