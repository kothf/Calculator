<title>PrefixCalc</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen instrument. History scrolls on top, display in the middle, keypad pinned to the thumb zone. */
:root {
  --bg: #eef0f2; --panel: #ffffff; --key: #ffffff; --key-fn: #e2e6ea; --key-op: #d9e2ec;
  --fg: #14181c; --muted: #66707a; --line: #d3d8dd;
  --prefix: #b86e00; --prefix-bg: #fff3df; --res-bg: #e6eefa; --res-line: #b9cdee; --eq: #1d5fd1; --eq-fg: #ffffff; --err: #c23a2b; --ok: #1f7a4a;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --panel: #0b0d0f; --key: #16191c; --key-fn: #22262a; --key-op: #1b2633;
  --fg: #eef1f4; --muted: #8a949e; --line: #262b30;
  --prefix: #ffb547; --prefix-bg: #241a0a; --res-bg: #0d1a2c; --res-line: #24406a; --eq: #3d7ff0; --eq-fg: #ffffff; --err: #ff6b5b; --ok: #4cc38a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #000000; --panel: #0b0d0f; --key: #16191c; --key-fn: #22262a; --key-op: #1b2633;
  --fg: #eef1f4; --muted: #8a949e; --line: #262b30;
  --prefix: #ffb547; --prefix-bg: #241a0a; --res-bg: #0d1a2c; --res-line: #24406a; --eq: #3d7ff0; --eq-fg: #ffffff; --err: #ff6b5b; --ok: #4cc38a; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
.app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 8px; box-sizing: border-box; }

header { display: flex; align-items: center; justify-content: space-between; }
header h1 { font: 600 13px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; margin: 0; color: var(--muted); }
header h1 b { color: var(--prefix); font-weight: 600; }
.hdr-btns { display: flex; gap: 6px; }
.chip { font: 500 12px/1 var(--sans); color: var(--muted); background: transparent; border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 10px; cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }

.history { flex: 1 1 auto; min-height: 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px;
  justify-content: flex-end; }
.history:empty::before { content: "No history yet. Press = to save a calculation."; color: var(--muted); font-size: 12px; text-align: right; }
.h-item { display: flex; justify-content: space-between; gap: 12px; padding: 6px 4px; border-radius: 6px; cursor: pointer;
  font: 400 14px/1.3 var(--mono); }
.h-item:active { background: var(--key-fn); }
.h-expr { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.h-val { color: var(--fg); white-space: nowrap; }

.display { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex;
  flex-direction: column; gap: 6px; }
#expr { width: 100%; box-sizing: border-box; border: 0; outline: 0; background: transparent; color: var(--fg);
  font: 400 22px/1.3 var(--mono); text-align: right; padding: 2px 0; caret-color: var(--eq); -webkit-user-select: text; user-select: text; }
.res-row { display: flex; align-items: center; gap: 6px; }
.eng { flex: none; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: transparent;
  color: var(--muted); font: 500 14px/1 var(--mono); cursor: pointer; }
#result { flex: 1; min-width: 0; text-align: right; font: 500 40px/1.1 var(--mono); font-variant-numeric: tabular-nums;
  white-space: nowrap; overflow-x: auto; cursor: pointer; touch-action: pan-y; scrollbar-width: none; }
#result .pfx { color: var(--prefix); }
#result.err { color: var(--err); font-size: 20px; font-family: var(--sans); }
#result.idle { color: var(--muted); }
.shift-badge { font: 500 10px/1 var(--sans); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.alts { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 4px 14px; font: 400 13px/1.3 var(--mono); color: var(--muted); min-height: 17px; }
.alts span + span::before { content: "|"; margin-right: 14px; color: var(--line); }
.eser { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px dashed var(--line); padding-top: 6px; min-height: 26px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--muted); font: 500 12px/1 var(--mono); padding: 6px 8px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
#eval { font: 400 14px/1.2 var(--mono); text-align: right; }
#eval .pct { color: var(--muted); }

.keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.prefixes { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.key { height: 52px; border: 0; border-radius: 12px; background: var(--key); color: var(--fg); font: 500 21px/1 var(--mono);
  cursor: pointer; touch-action: manipulation; box-shadow: 0 1px 0 var(--line); }
.key:active, .key.down { filter: brightness(.88); transform: translateY(1px); }
.key.fn { background: var(--key-fn); font-size: 17px; }
.key.op { background: var(--key-op); }
.key.eq { background: var(--eq); color: var(--eq-fg); }
.key.ac { color: var(--err); font-family: var(--sans); font-weight: 600; font-size: 16px; }
.key.px { height: 42px; background: var(--prefix-bg); color: var(--prefix); font-size: 19px; box-shadow: none; }
.key.small { height: 36px; font-size: 14px; font-family: var(--sans); }
.cursor-row { display: grid; grid-template-columns: 1fr 1fr 1.4fr 1.6fr; gap: 6px; }
.key.tools { background: var(--key-op); font-weight: 600; }

/* Tools sheet: full-screen panel over the calculator */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; -webkit-user-select: text; user-select: text;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-inner { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 32px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; }
.sheet-head h2 { margin: 0; font: 600 20px/1.2 var(--sans); outline: none; }
.done { font: 600 15px/1 var(--sans); color: var(--eq); background: transparent; border: 0; padding: 8px 4px; cursor: pointer; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: 500 13px/1 var(--sans); padding: 10px 4px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); }
.tool-hint { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
.modes { display: flex; gap: 6px; flex-wrap: wrap; }
.modes button { font: 500 13px/1 var(--sans); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--res-bg); color: var(--eq); border-color: var(--eq); font-weight: 600; }
.modes[hidden], .field-err[hidden] { display: none; }
.step { margin: 0; font: 600 11px/1.2 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font: 500 13px/1.2 var(--sans); color: var(--fg); }
.field label .unit { color: var(--muted); font-weight: 400; }
.field label .opt { color: var(--muted); font-weight: 400; }
.field input { width: 100%; box-sizing: border-box; font: 400 18px/1.2 var(--mono); color: var(--fg); background: var(--panel);
  border: 1px solid var(--muted); border-radius: 10px; padding: 10px; outline: none; }
.field input:focus { border-color: var(--eq); box-shadow: 0 0 0 2px var(--res-line); }
.field input[aria-invalid="true"] { border-color: var(--err); }
.field-err { font-size: 12px; line-height: 1.35; color: var(--err); }
.result { background: var(--res-bg); border: 1px solid var(--res-line); border-radius: 14px; padding: 4px 14px 6px; }
.result .step { margin: 10px 0 2px; }
.out { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--res-line); }
.result .step + .out { border-top: 0; }
.out-label { flex: 1; min-width: 0; font-size: 14px; }
.out-val { font: 600 20px/1.2 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.out-val .pfx { color: var(--prefix); }
.out-note { font: 400 12px/1.2 var(--mono); color: var(--muted); white-space: nowrap; }
.use { flex: none; font: 600 12px/1 var(--sans); color: var(--eq); background: transparent; border: 1px solid var(--res-line); border-radius: 8px; padding: 7px 9px; cursor: pointer; }
.result-empty { padding: 10px 0 8px; color: var(--muted); font-size: 14px; line-height: 1.4; }
@media (max-width: 360px) { .out-note { display: none; } }
.key:focus-visible, .chip:focus-visible, .eng:focus-visible, .seg button:focus-visible { outline: 2px solid var(--eq); outline-offset: 2px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
  background: var(--fg); color: var(--bg); font: 500 13px/1 var(--sans); padding: 10px 14px; border-radius: 999px; opacity: 0;
  transition: opacity .15s, transform .15s; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-height: 700px) { .key { height: 44px; } .key.px { height: 36px; } #result { font-size: 32px; } .key.small { height: 32px; } }
@media (max-height: 600px) { .key { height: 40px; font-size: 19px; } .key.px { height: 32px; } .key.small { height: 30px; } #result { font-size: 28px; } #expr { font-size: 19px; } .app { gap: 6px; } }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } .key:active { transform: none; } }
</style>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var input = $('expr'), resultEl = $('result'), altsEl = $('alts'), evalEl = $('eval'), histEl = $('history');
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem('prefixcalc:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('prefixcalc:' + k, JSON.stringify(v)); } catch (e) {} }
  };
  var state = { value: null, shift: 0, series: store.get('series', 'E24'), haptic: store.get('haptic', true), history: store.get('history', []) };
  var SIG = 4;

  // ---------- haptics (Android vibrates; iOS Safari has no web vibration API) ----------
  // Android/Chrome: Vibration API. iOS Safari has none, but since iOS 18 toggling an
  // <input type="checkbox" switch> plays the system haptic tick, so we click a hidden one.
  var hapticLabel = (function () {
    if (navigator.vibrate) return null;
    var label = document.createElement('label'), sw = document.createElement('input');
    sw.type = 'checkbox'; sw.setAttribute('switch', ''); sw.tabIndex = -1;
    label.setAttribute('aria-hidden', 'true'); label.style.display = 'none';
    label.appendChild(sw); document.body.appendChild(label);
    return label;
  })();
  function buzz() {
    if (!state.haptic) return;
    try {
      if (navigator.vibrate) navigator.vibrate(12);
      else if (hapticLabel) hapticLabel.click();
    } catch (e) {}
  }

  // ---------- editing at the caret ----------
  function sel() { return { s: input.selectionStart == null ? input.value.length : input.selectionStart, e: input.selectionEnd == null ? input.value.length : input.selectionEnd }; }
  function setCaret(p) { try { input.setSelectionRange(p, p); } catch (e) {} }
  function insert(txt) {
    var r = sel(), v = input.value;
    input.value = v.slice(0, r.s) + txt + v.slice(r.e);
    setCaret(r.s + txt.length);
    changed();
  }
  function backspace() {
    var r = sel(), v = input.value;
    if (r.s !== r.e) { input.value = v.slice(0, r.s) + v.slice(r.e); setCaret(r.s); }
    else if (r.s > 0) {
      var m = v.slice(0, r.s).match(/ (\|\||[×÷−+]) $/), n = m ? m[0].length : (v.slice(r.s - 2, r.s) === '||' ? 2 : 1);
      input.value = v.slice(0, r.s - n) + v.slice(r.s); setCaret(r.s - n);
    }
    changed();
  }
  function move(d) { var r = sel(); setCaret(Math.max(0, Math.min(input.value.length, (d < 0 ? r.s : r.e) + d))); }

  // ---------- evaluation & display ----------
  function changed() { state.shift = 0; render(); }

  function render() {
    var src = input.value.trim();
    altsEl.textContent = ''; evalEl.textContent = ''; resultEl.className = '';
    if (!src) { state.value = null; resultEl.className = 'idle'; resultEl.textContent = '0'; return; }
    try {
      var v = SI.evaluate(src);
      state.value = v;
      var auto = SI.autoExp3(v, SIG);
      var e3 = Math.max(SI.MIN_E3, Math.min(SI.MAX_E3, auto + state.shift * 3));
      state.shift = (e3 - auto) / 3;
      var shown = state.shift === 0 ? SI.format(v, SIG) : SI.formatAt(v, e3, SIG);
      paintResult(shown);
      SI.alternatives(v, e3, SIG).forEach(function (a) { var s = document.createElement('span'); s.textContent = a; altsEl.appendChild(s); });
      var ne = SI.nearestE(v, state.series);
      if (ne) {
        var pct = ne.errorPct, ps = Math.abs(pct) < 0.05 ? 'exact' : (pct >= 0 ? '+' : '−') + Math.abs(pct).toFixed(Math.abs(pct) < 10 ? 1 : 0) + '%';
        evalEl.innerHTML = '';
        evalEl.appendChild(document.createTextNode(state.series + ': ' + ne.label + ' '));
        var sp = document.createElement('span'); sp.className = 'pct'; sp.textContent = '(' + ps + ')'; evalEl.appendChild(sp);
      } else { evalEl.textContent = state.series + ': —'; }
    } catch (e) {
      state.value = null;
      if (e.code === 'incomplete') { resultEl.className = 'idle'; resultEl.textContent = '…'; return; }
      resultEl.className = 'err';
      resultEl.textContent = e.message || 'Error';
    }
  }
  function paintResult(text) {
    resultEl.textContent = '';
    var m = text.match(/^(.*?)([pnµmkMGTf]?)$/);
    resultEl.appendChild(document.createTextNode(m[1]));
    if (m[2]) { var s = document.createElement('span'); s.className = 'pfx'; s.textContent = m[2]; resultEl.appendChild(s); }
  }

  // Full-precision text that parses back to the same number (for re-use in a new line).
  function reusable(v) { return SI.format(v, 10).replace(/^-/, '−'); }

  function commit() {
    if (state.value == null) return;
    var expr = input.value.trim(), v = state.value;
    state.history.push({ expr: expr, value: v });
    if (state.history.length > 50) state.history = state.history.slice(-50);
    store.set('history', state.history);
    renderHistory();
    input.value = reusable(v); setCaret(input.value.length); changed();
  }

  function renderHistory() {
    histEl.textContent = '';
    state.history.forEach(function (h) {
      var row = document.createElement('div'); row.className = 'h-item'; row.tabIndex = 0;
      row.title = 'Tap to insert the result, hold to insert the expression';
      var a = document.createElement('span'); a.className = 'h-expr'; a.textContent = h.expr;
      var b = document.createElement('span'); b.className = 'h-val'; b.textContent = SI.format(h.value, SIG);
      row.appendChild(a); row.appendChild(b);
      var timer = null, longFired = false;
      row.addEventListener('pointerdown', function (ev) {
        ev.preventDefault(); longFired = false;
        timer = setTimeout(function () { longFired = true; buzz(); insert(h.expr); }, 500);
      });
      var cancel = function () { clearTimeout(timer); };
      row.addEventListener('pointerleave', cancel); row.addEventListener('pointercancel', cancel);
      row.addEventListener('pointerup', function () { cancel(); if (!longFired) { buzz(); insert(reusable(h.value)); } });
      row.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') insert(ev.shiftKey ? h.expr : reusable(h.value)); });
      histEl.appendChild(row);
    });
    histEl.scrollTop = histEl.scrollHeight;
  }

  // ---------- copy ----------
  var toastT;
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 1200); }
  function copyResult() {
    if (state.value == null) return;
    var text = resultEl.textContent;
    var done = function () { toast('Copied: ' + text); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text) ? done() : toast('Copy failed'); });
    } else { fallbackCopy(text) ? done() : toast('Copy failed'); }
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta); input.focus(); return ok;
  }

  // ---------- keypad ----------
  var actions = {
    ac: function () { input.value = ''; changed(); },
    tools: function () { openTools(); },
    bs: backspace, left: function () { move(-1); }, right: function () { move(1); }, eq: commit,
    inv: function () {
      var r = sel(), v = input.value;
      if (r.s !== r.e) { var part = v.slice(r.s, r.e); input.value = v.slice(0, r.s) + '1/(' + part + ')' + v.slice(r.e); setCaret(r.s + part.length + 4); changed(); }
      else if (r.s === v.length && v.trim()) { input.value = '1/(' + v + ')'; setCaret(input.value.length); changed(); }
      else insert('1/(');
    }
  };
  document.querySelectorAll('.key').forEach(function (k) {
    k.addEventListener('pointerdown', function (ev) { ev.preventDefault(); }); // keep focus & caret in the input
    k.addEventListener('click', function () {
      buzz();
      var i = k.dataset.i;
      if (k.dataset.a) actions[k.dataset.a](); else insert(/^(\|\||[×÷−+])$/.test(i) ? ' ' + i + ' ' : i);
      if (document.activeElement !== input) input.focus({ preventScroll: true });
    });
  });

  // physical keyboard & typing into the field
  input.addEventListener('input', changed);
  input.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' || ev.key === '=') { ev.preventDefault(); commit(); }
    else if (ev.key === 'Escape') { ev.preventDefault(); actions.ac(); }
    else if (ev.key === '|' ) { ev.preventDefault(); insert('||'); }
  });
  document.addEventListener('keydown', function (ev) {
    if (!$('tools').hidden) { if (ev.key === 'Escape') { ev.preventDefault(); closeTools(); } return; }
    if (document.activeElement === input || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (ev.key.length === 1) { ev.preventDefault(); input.focus(); insert(ev.key === '|' ? '||' : ev.key); }
    else if (ev.key === 'Backspace') { ev.preventDefault(); input.focus(); backspace(); }
    else if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
  });

  // swipe along the expression line moves the caret
  (function () {
    var x0 = null, moved = 0;
    input.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; moved = 0; }, { passive: true });
    input.addEventListener('touchmove', function (e) {
      if (x0 == null) return;
      var dx = e.touches[0].clientX - x0, steps = Math.trunc(dx / 14);
      if (steps !== moved) { move(steps - moved); moved = steps; buzz(); }
    }, { passive: true });
    input.addEventListener('touchend', function () { x0 = null; });
  })();

  // ENG shift: buttons and horizontal swipe on the result
  function shift(d) { if (state.value == null) return; state.shift += d; buzz(); render(); }
  $('engL').addEventListener('click', function () { shift(-1); });
  $('engR').addEventListener('click', function () { shift(1); });
  [$('engL'), $('engR')].forEach(function (b) { b.addEventListener('pointerdown', function (e) { e.preventDefault(); }); });
  (function () {
    var x0 = null, swiped = false;
    resultEl.addEventListener('pointerdown', function (e) { e.preventDefault(); x0 = e.clientX; swiped = false; });
    resultEl.addEventListener('pointermove', function (e) {
      if (x0 == null || swiped) return;
      var dx = e.clientX - x0;
      if (Math.abs(dx) > 40) { swiped = true; shift(dx < 0 ? -1 : 1); }
    });
    resultEl.addEventListener('pointerup', function () { if (x0 != null && !swiped) copyResult(); x0 = null; });
    resultEl.addEventListener('pointercancel', function () { x0 = null; });
  })();

  // series selector
  function paintSeries() { document.querySelectorAll('#seriesSeg button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.s === state.series)); }); }
  document.querySelectorAll('#seriesSeg button').forEach(function (b) {
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); });
    b.addEventListener('click', function () { state.series = b.dataset.s; store.set('series', state.series); paintSeries(); buzz(); render(); });
  });

  $('hapticBtn').addEventListener('click', function () { state.haptic = !state.haptic; store.set('haptic', state.haptic); this.setAttribute('aria-pressed', String(state.haptic)); buzz(); });
  $('hapticBtn').setAttribute('aria-pressed', String(state.haptic));
  $('clearHist').addEventListener('click', function () { state.history = []; store.set('history', []); renderHistory(); });

  // initial state: the example from the idea, so the first screen shows what the app does
  if (store.get('history', null) === null) state.history = [{ expr: '4k7 + 330', value: 5030 }, { expr: '1/(2π × 10k × 10n)', value: 1 / (2 * Math.PI * 1e4 * 1e-8) }];
  input.value = '10n × 100k';
  // ---------- Tools sheet ----------
  // Each tool has one or more modes. A mode lists its inputs (key, label, unit, default, optional)
  // and turns the parsed values into result rows [label, value, unit, note].
  var TOOL_DEFS = {
    divider: { modes: [
      { id: 'vout', label: 'Find Vout', hint: 'Vout = Vin · R2 / (R1 + R2). R1 is the top resistor, R2 the bottom one.',
        fields: [['vin', 'Vin', 'V', '12'], ['r1', 'R1, top', 'Ω', '10k'], ['r2', 'R2, bottom', 'Ω', '4k7']],
        run: function (v) {
          var d = TOOLS.divider(v.vin, v.r1, v.r2);
          return [['Vout', d.vout, 'V'], ['Ratio Vout/Vin', d.ratio, ''], ['Current', d.current, 'A'], ['Power', d.power, 'W']];
        } },
      { id: 'pick', label: 'Pick R1, R2', hint: 'Finds the pair of standard resistors from the selected series that gives Vout closest to your target.',
        fields: [['vin', 'Vin', 'V', '12'], ['vt', 'Wanted Vout', 'V', '3.3'], ['rt', 'R1 + R2 about', 'Ω', '10k', true]],
        series: true,
        run: function (v) {
          var d = TOOLS.designDivider(v.vin, v.vt, state.series, v.rt);
          return [['R1, top', d.r1, 'Ω'], ['R2, bottom', d.r2, 'Ω'], ['Vout you get', d.vout, 'V', pct(d.errorPct)], ['Current', d.current, 'A']];
        } }
    ] },
    rc: { modes: [
      { id: 'rc', label: 'RC filter', hint: 'Time constant and −3 dB cutoff of an RC low-pass or high-pass filter.',
        fields: [['r', 'R', 'Ω', '10k'], ['c', 'C', 'F', '10n']],
        run: function (v) { var x = TOOLS.rc(v.r, v.c); return [['Time constant τ = RC', x.tau, 's'], ['Cutoff 1/(2πRC)', x.fc, 'Hz']]; } },
      { id: 'lc', label: 'LC resonance', hint: 'Resonant frequency and characteristic impedance of an LC circuit.',
        fields: [['l', 'L', 'H', '10µ'], ['c', 'C', 'F', '10n']],
        run: function (v) { var x = TOOLS.lcResonance(v.l, v.c); return [['Resonance f₀', x.f0, 'Hz'], ['Impedance √(L/C)', x.z0, 'Ω']]; } },
      { id: 'x', label: 'Reactance', hint: 'Reactance of a capacitor and of an inductor at frequency f. Fill in C, L or both.',
        fields: [['f', 'Frequency f', 'Hz', '1k'], ['c', 'C', 'F', '10n', true], ['l', 'L', 'H', '10µ', true]],
        run: function (v) {
          var rows = [];
          if (v.c != null) rows.push(['X_C = 1/(2πfC)', TOOLS.reactanceC(v.f, v.c), 'Ω']);
          if (v.l != null) rows.push(['X_L = 2πfL', TOOLS.reactanceL(v.f, v.l), 'Ω']);
          if (!rows.length) throw new TOOLS.ToolError('Enter C, L or both.');
          return rows;
        } }
    ] },
    led: { modes: [
      { id: 'led', label: 'LED resistor', hint: 'R = (Vs − Vf) / I, rounded up to the next value of the selected series so the LED never gets more current than you set.',
        fields: [['vs', 'Supply Vs', 'V', '5'], ['vf', 'LED forward voltage Vf', 'V', '2'], ['i', 'LED current', 'A', '10m']],
        series: true,
        run: function (v) {
          var x = TOOLS.ledResistor(v.vs, v.vf, v.i, state.series);
          return [['Resistor', x.standard, 'Ω'], ['Exact value', x.exact, 'Ω'], ['Actual current', x.current, 'A'], ['Resistor power', x.power, 'W'], ['LED power', x.ledPower, 'W']];
        } }
    ] },
    ohm: { modes: [
      { id: 'ohm', label: "Ohm's law", hint: 'Fill in any two of V, I, R and P and leave the other two empty.',
        fields: [['v', 'Voltage V', 'V', '5', true], ['i', 'Current I', 'A', '', true], ['r', 'Resistance R', 'Ω', '1k', true], ['p', 'Power P', 'W', '', true]],
        anyTwo: true,
        run: function (v) {
          var x = TOOLS.ohm(v.v, v.i, v.r, v.p);
          return [['Voltage', x.v, 'V'], ['Current', x.i, 'A'], ['Resistance', x.r, 'Ω'], ['Power', x.p, 'W']];
        } }
    ] }
  };
  var tool = store.get('tool', 'divider');
  if (!TOOL_DEFS[tool]) tool = 'divider';
  var toolModes = store.get('toolModes', {});

  function pct(p) { return Math.abs(p) < 0.005 ? 'exact' : (p >= 0 ? '+' : '−') + Math.abs(p).toFixed(Math.abs(p) < 10 ? 2 : 1) + '%'; }
  function currentMode() {
    var modes = TOOL_DEFS[tool].modes, id = toolModes[tool];
    return modes.filter(function (m) { return m.id === id; })[0] || modes[0];
  }
  function savedValue(k, def) { var saved = store.get('tool:' + tool, {}); return saved[k] != null ? saved[k] : def; }
  function parseField(txt) {
    txt = txt.trim();
    if (!txt) return { value: null };
    try { return { value: SI.evaluate(txt) }; }
    catch (e) { return { error: e.code === 'incomplete' ? 'Finish the expression' : (e.message || 'Not a number') }; }
  }
  function showFieldError(inp, msg) {
    var err = document.getElementById(inp.id + '-err');
    if (msg) { inp.setAttribute('aria-invalid', 'true'); err.textContent = msg + '. Example: 4k7, 10n, 3.3'; err.hidden = false; }
    else { inp.removeAttribute('aria-invalid'); err.textContent = ''; err.hidden = true; }
  }

  function renderToolFields() {
    var mode = currentMode(), box = $('toolFields'), modesBox = $('toolModes');
    document.querySelectorAll('#toolTabs button').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === tool)); });
    modesBox.textContent = '';
    var modes = TOOL_DEFS[tool].modes;
    modesBox.hidden = modes.length < 2;
    modes.forEach(function (m) {
      var b = document.createElement('button'); b.textContent = m.label; b.setAttribute('aria-pressed', String(m === mode));
      b.addEventListener('click', function () { toolModes[tool] = m.id; store.set('toolModes', toolModes); buzz(); renderToolFields(); });
      modesBox.appendChild(b);
    });
    $('toolHint').textContent = mode.hint;
    box.textContent = '';
    mode.fields.forEach(function (f) {
      var id = 'tf-' + tool + '-' + f[0];
      var wrap = document.createElement('div'); wrap.className = 'field';
      var lab = document.createElement('label'); lab.htmlFor = id;
      lab.appendChild(document.createTextNode(f[1] + ' '));
      var u = document.createElement('span'); u.className = 'unit'; u.textContent = '(' + f[2] + ')'; lab.appendChild(u);
      if (f[4] && !mode.anyTwo) { var o = document.createElement('span'); o.className = 'opt'; o.textContent = ', optional'; lab.appendChild(o); }
      var inp = document.createElement('input');
      inp.id = id; inp.type = 'text'; inp.value = savedValue(f[0], f[3]); inp.dataset.k = f[0];
      inp.setAttribute('autocomplete', 'off'); inp.setAttribute('autocorrect', 'off'); inp.setAttribute('autocapitalize', 'off'); inp.spellcheck = false;
      inp.setAttribute('enterkeyhint', 'done'); inp.setAttribute('aria-describedby', id + '-err');
      var err = document.createElement('div'); err.className = 'field-err'; err.id = id + '-err'; err.hidden = true;
      inp.addEventListener('input', function () {
        var saved = store.get('tool:' + tool, {}); saved[f[0]] = inp.value; store.set('tool:' + tool, saved);
        if (inp.getAttribute('aria-invalid') && !parseField(inp.value).error) showFieldError(inp, null); // clear errors while typing, never add them
        renderToolOut();
      });
      inp.addEventListener('blur', function () { showFieldError(inp, parseField(inp.value).error); });
      inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') inp.blur(); });
      wrap.appendChild(lab); wrap.appendChild(inp); wrap.appendChild(err); box.appendChild(wrap);
      showFieldError(inp, parseField(inp.value).error);
    });
    renderToolOut();
  }

  function renderToolOut() {
    var mode = currentMode(), v = {}, bad = [], missing = [];
    mode.fields.forEach(function (f) {
      var inp = document.getElementById('tf-' + tool + '-' + f[0]), r = parseField(inp ? inp.value : '');
      v[f[0]] = r.error ? null : r.value;
      if (r.error) bad.push(f[1]);
      else if (r.value == null && !f[4]) missing.push(f[1]);
    });
    var out = $('toolOut'); out.textContent = '';
    var h = document.createElement('h3'); h.className = 'step'; h.id = 'resultTitle';
    h.textContent = 'Result' + (mode.series ? ' · ' + state.series + ' series' : '');
    out.appendChild(h);
    var rows = null, msg = null;
    if (bad.length) msg = 'Fix ' + bad.join(', ') + ' above to see the result.';
    else if (missing.length) msg = 'Enter ' + missing.join(', ') + ' to see the result.';
    else { try { rows = mode.run(v); } catch (e) { msg = e.message || 'Cannot calculate with these values.'; } }
    if (msg) { var m = document.createElement('div'); m.className = 'result-empty'; m.textContent = msg; out.appendChild(m); }
    (rows || []).forEach(function (r) { out.appendChild(outRow(r[0], r[1], r[2], r[3])); });
  }
  function outRow(label, value, unit, note) {
    var row = document.createElement('div'); row.className = 'out';
    var l = document.createElement('span'); l.className = 'out-label'; l.textContent = label;
    var val = document.createElement('span'); val.className = 'out-val';
    var txt = unit ? SI.format(value, 4) : String(Number(value.toPrecision(4)));
    var m = txt.match(/^(.*?)([pnµmkMGTf]?)$/);
    val.appendChild(document.createTextNode(m[1]));
    if (m[2]) { var px = document.createElement('span'); px.className = 'pfx'; px.textContent = m[2]; val.appendChild(px); }
    if (unit) val.appendChild(document.createTextNode(unit));
    row.appendChild(l);
    if (note) { var n = document.createElement('span'); n.className = 'out-note'; n.textContent = note; row.appendChild(n); }
    row.appendChild(val);
    var use = document.createElement('button'); use.className = 'use'; use.textContent = 'Use';
    use.setAttribute('aria-label', 'Use ' + label + ' in the calculator');
    use.addEventListener('click', function () { buzz(); closeTools(); insert(reusable(value)); });
    row.appendChild(use);
    return row;
  }
  function openTools() {
    $('tools').hidden = false; document.body.style.overflow = 'hidden';
    renderToolFields(); $('toolsTitle').focus({ preventScroll: true });
  }
  function closeTools() {
    $('tools').hidden = true; document.body.style.overflow = '';
    input.focus({ preventScroll: true });
  }
  $('toolsDone').addEventListener('click', function () { buzz(); closeTools(); });
  document.querySelectorAll('#toolTabs button').forEach(function (b) {
    b.addEventListener('click', function () { tool = b.dataset.tab; store.set('tool', tool); buzz(); renderToolFields(); });
  });

  paintSeries(); renderHistory(); render();
  setCaret(input.value.length);
  input.focus({ preventScroll: true });
})();
</script>
